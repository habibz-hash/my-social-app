<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پایگاه حقیقت علمی | Scientific Truth Platform</title>
    <!-- کتابخانه Ethers.js برای تعامل واقعی با بلاکچین -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --bg: #030305;
            --surface: rgba(20, 20, 30, 0.7);
            --text: #ffffff;
            --text-secondary: #a1a1aa;
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --glass: rgba(255, 255, 255, 0.07);
            --border: rgba(255, 255, 255, 0.1);
        }
        .light-mode {
            --bg: #f8fafc;
            --surface: rgba(255, 255, 255, 0.8);
            --text: #0f172a;
            --text-secondary: #64748b;
            --accent: #6d28d9;
            --accent-glow: rgba(109, 40, 217, 0.2);
            --glass: rgba(0, 0, 0, 0.04);
            --border: rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; transition: background 0.3s, color 0.3s; }

        .page { display: none; height: 100vh; overflow-y: auto; padding-bottom: 90px; }
        .page.active { display: block; }

        /* نوار جستجو و فیلتر */
        .top-header { position: fixed; top: 0; left: 0; width: 100%; z-index: 100; background: var(--surface); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
        .search-input { width: 100%; background: var(--glass); border: 1px solid var(--border); padding: 10px 15px; border-radius: 12px; color: var(--text); outline: none; font-size: 14px; }
        .filter-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        .filter-scroll::-webkit-scrollbar { display: none; }
        .filter-chip { background: var(--glass); border: 1px solid var(--border); color: var(--text-secondary); padding: 6px 14px; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer; transition: 0.2s; }
        .filter-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }

        /* فید ویدیوها */
        #video-list { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
        #video-list::-webkit-scrollbar { display: none; }
        .reel-card { height: 100vh; scroll-snap-align: start; position: relative; width: 100%; background: #000; }
        .reel-card iframe { width: 100%; height: 100%; border: 0; }
        
        .overlay-ui { position: absolute; bottom: 100px; right: 16px; z-index: 10; display: flex; flex-direction: column; gap: 16px; align-items: center; }
        .action-btn { background: var(--surface); backdrop-filter: blur(10px); border: 1px solid var(--border); width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); font-size: 18px; transition: 0.2s; }
        .action-btn:hover { transform: scale(1.1); background: var(--accent); color: #fff; }
        .action-count { font-size: 11px; color: var(--text); text-align: center; margin-top: 2px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

        .video-info { position: absolute; bottom: 100px; right: 80px; left: 20px; z-index: 10; text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
        .video-title { font-size: 16px; font-weight: bold; margin-bottom: 4px; }
        .video-cat { display: inline-block; background: var(--accent); color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 6px; }

        /* مودال نظرات */
        #comment-modal { position: fixed; bottom: -100%; left: 0; width: 100%; height: 75vh; background: var(--surface); backdrop-filter: blur(20px); border-radius: 24px 24px 0 0; border-top: 1px solid var(--border); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; padding: 20px; display: flex; flex-direction: column; box-sizing: border-box; }
        #comment-modal.open { bottom: 0; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: bold; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .comment-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .comment-bubble { background: var(--glass); padding: 10px 14px; border-radius: 12px; font-size: 13px; border: 1px solid var(--border); }
        .comment-input-box { display: flex; gap: 10px; }
        .comment-input-box input { flex: 1; background: var(--glass); border: 1px solid var(--border); padding: 10px 14px; border-radius: 12px; color: var(--text); outline: none; }
        .comment-input-box button { background: var(--accent); color: white; border: none; padding: 0 20px; border-radius: 12px; font-weight: bold; cursor: pointer; }

        /* صفحات آپلود و پروفایل */
        .form-container, .profile-container { padding: 90px 20px 20px 20px; max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
        .form-control { width: 100%; background: var(--surface); border: 1px solid var(--border); padding: 12px; border-radius: 12px; color: var(--text); outline: none; font-size: 14px; }
        .btn-primary { width: 100%; background: var(--accent); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 4px 15px var(--accent-glow); transition: 0.2s; }
        .btn-primary:active { transform: scale(0.98); }

        /* داشبورد و پروفایل */
        .profile-header { text-align: center; margin-bottom: 24px; }
        .avatar-box { width: 80px; height: 80px; background: var(--accent); border-radius: 50%; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 32px; box-shadow: 0 0 20px var(--accent-glow); }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); padding: 16px; border-radius: 16px; text-align: center; }
        .stat-num { font-size: 18px; font-weight: bold; color: var(--accent); margin-top: 4px; }

        /* نویگیشن بار پایین */
        .nav-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--surface); backdrop-filter: blur(16px); padding: 8px 16px; border-radius: 35px; display: flex; gap: 24px; z-index: 500; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .nav-item { background: none; border: none; color: var(--text-secondary); font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: 0.2s; padding: 6px 12px; border-radius: 20px; }
        .nav-item.active { color: var(--accent); background: var(--glass); }
        .nav-item span { font-size: 16px; }
    </style>
</head>
<body>

    <!-- فید ویدیوها با جستجو و دسته‌بندی -->
    <div id="feed" class="page active">
        <div class="top-header">
            <input type="text" class="search-input" id="search-box" placeholder="جستجو در حقیقت‌های علمی..." oninput="filterVideos()">
            <div class="filter-scroll" id="category-filters">
                <button class="filter-chip active" onclick="setCategory('همه', this)">همه</button>
                <button class="filter-chip" onclick="setCategory('نجوم', this)">نجوم</button>
                <button class="filter-chip" onclick="setCategory('فیزیک', this)">فیزیک</button>
                <button class="filter-chip" onclick="setCategory('زیست‌شناسی', this)">زیست‌شناسی</button>
                <button class="filter-chip" onclick="setCategory('هوش مصنوعی', this)">هوش مصنوعی</button>
            </div>
        </div>
        <div id="video-list"></div>
    </div>

    <!-- آپلود محتوا -->
    <div id="upload" class="page">
        <div class="form-container">
            <h2 style="margin-bottom: 20px;">انتشار محتوای علمی</h2>
            <div class="form-group">
                <label>عنوان ویدیو</label>
                <input type="text" id="v-title" class="form-control" placeholder="مثلاً: راز سیاه‌چاله‌ها">
            </div>
            <div class="form-group">
                <label>لینک Embed (یوتیوب / آپارات)</label>
                <input type="text" id="v-url" class="form-control" placeholder="https://www.aparat.com/embed/...">
            </div>
            <div class="form-group">
                <label>دسته‌بندی علمی</label>
                <select id="v-cat" class="form-control">
                    <option value="نجوم">نجوم</option>
                    <option value="فیزیک">فیزیک</option>
                    <option value="زیست‌شناسی">زیست‌شناسی</option>
                    <option value="هوش مصنوعی">هوش مصنوعی</option>
                </select>
            </div>
            <button class="btn-primary" onclick="addNewVideo()">انتشار در پایگاه حقیقت</button>
        </div>
    </div>

    <!-- پروفایل و داشبورد سازندگان -->
    <div id="profile" class="page">
        <div class="profile-container">
            <div class="profile-header">
                <div class="avatar-box">🔬</div>
                <input type="text" id="username-input" class="form-control" style="text-align: center; font-weight: bold; margin-bottom: 12px;" placeholder="نام محقق">
                <button class="btn-primary" id="wallet-btn" onclick="connectWallet()" style="background: #f6851b; margin-bottom: 8px;">اتصال کیف پول MetaMask</button>
                <p id="wallet-status" style="font-size: 12px; color: var(--text-secondary);">کیف پول متصل نیست</p>
            </div>

            <h3 style="margin-bottom: 12px; font-size: 16px;">آمار عملکرد شما</h3>
            <div class="stats-grid">
                <div class="stat-card">
                    <div style="font-size: 12px; color: var(--text-secondary);">ویدیوها</div>
                    <div class="stat-num" id="stat-videos">0</div>
                </div>
                <div class="stat-card">
                    <div style="font-size: 12px; color: var(--text-secondary);">مجموع لایک</div>
                    <div class="stat-num" id="stat-likes">0</div>
                </div>
                <div class="stat-card">
                    <div style="font-size: 12px; color: var(--text-secondary);">حمایت‌ها (ETH)</div>
                    <div class="stat-num" id="stat-donations">0.0</div>
                </div>
            </div>

            <button class="btn-primary" onclick="toggleTheme()" style="background: var(--surface); border: 1px solid var(--border); color: var(--text);">تغییر تم (روشن / تیره)</button>
        </div>
    </div>

    <!-- مودال نظرات -->
    <div id="comment-modal">
        <div class="modal-header">
            <span>نظرات علمی</span>
            <span onclick="closeComments()" style="cursor:pointer; font-size:18px;">✕</span>
        </div>
        <div class="comment-list" id="comment-list"></div>
        <div class="comment-input-box">
            <input type="text" id="new-comment-text" placeholder="دیدگاه علمی خود را بنویسید...">
            <button onclick="submitComment()">ارسال</button>
        </div>
    </div>

    <!-- نویگیشن بار پایین -->
    <nav class="nav-bar">
        <button class="nav-item active" onclick="switchPage('feed', this)"><span>🏠</span>خانه</button>
        <button class="nav-item" onclick="switchPage('upload', this)"><span>➕</span>آپلود</button>
        <button class="nav-item" onclick="switchPage('profile', this)"><span>👤</span>پروفایل</button>
    </nav>

    <script>
        // دیتابیس محلی و مدیریت حالت (State)
        let videos = JSON.parse(localStorage.getItem('scientific_videos')) || [
            { title: "نگاهی به تلسکوپ جیمز وب", url: "https://www.aparat.com/embed/v/sample1", category: "نجوم", likes: 142, comments: ["فوق‌العاده بود!", "تصاویر شگفت‌انگیزی ثبت کرده."] },
            { title: "مکانیک کوانتومی به زبان ساده", url: "https://www.aparat.com/embed/v/sample2", category: "فیزیک", likes: 98, comments: ["عالی بود، ممنون."] }
        ];
        let userSettings = JSON.parse(localStorage.getItem('scientific_user')) || { name: "محقق علمی", theme: "dark", wallet: null, donations: 0.0 };
        let currentActiveCategory = "همه";
        let currentVideoIndex = null;
        let provider, signer;

        // راه‌اندازی اولیه اپلیکیشن
        function initApp() {
            if (userSettings.theme === 'light') document.body.classList.add('light-mode');
            document.getElementById('username-input').value = userSettings.name;
            if (userSettings.wallet) {
                updateWalletUI(userSettings.wallet);
            }
            renderFeed();
            updateStats();
        }

        // تغییر صفحات SPA
        function switchPage(pageId, btnElement) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            btnElement.classList.add('active');
            if(pageId === 'profile') updateStats();
        }

        // رندر فید ویدیوها با قابلیت جستجو و دسته‌بندی
        function renderFeed(filteredList = null) {
            const listEl = document.getElementById('video-list');
            const targetVideos = filteredList || videos;

            if (targetVideos.length === 0) {
                listEl.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; height:100vh; color:var(--text-secondary);">محتوایی یافت نشد.</div>`;
                return;
            }

            listEl.innerHTML = targetVideos.map((v, index) => {
                const globalIndex = videos.indexOf(v);
                return `
                    <div class="reel-card">
                        <iframe src="${v.url}" allowfullscreen></iframe>
                        <div class="video-info">
                            <span class="video-cat">${v.category}</span>
                            <div class="video-title">${v.title}</div>
                        </div>
                        <div class="overlay-ui">
                            <div>
                                <button class="action-btn" onclick="likeVideo(${globalIndex})">❤️</button>
                                <div class="action-count">${v.likes || 0}</div>
                            </div>
                            <div>
                                <button class="action-btn" onclick="openComments(${globalIndex})">💬</button>
                                <div class="action-count">${(v.comments || []).length}</div>
                            </div>
                            <div>
                                <button class="action-btn" onclick="donateETH()" title="حمایت اتریومی">💎</button>
                                <div class="action-count">ETH</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // فیلتر دسته‌بندی
        function setCategory(cat, element) {
            currentActiveCategory = cat;
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            filterVideos();
        }

        // جستجوی زنده
        function filterVideos() {
            const query = document.getElementById('search-box').value.toLowerCase();
            const filtered = videos.filter(v => {
                const matchesCat = (currentActiveCategory === 'همه' || v.category === currentActiveCategory);
                const matchesSearch = v.title.toLowerCase().includes(query);
                return matchesCat && matchesSearch;
            });
            renderFeed(filtered);
        }

        // سیستم لایک واقعی
        function likeVideo(index) {
            videos[index].likes = (videos[index].likes || 0) + 1;
            saveData();
            renderFeed();
        }

        // سیستم نظرات
        function openComments(index) {
            currentVideoIndex = index;
            document.getElementById('comment-modal').classList.add('open');
            renderCommentsList();
        }

        function closeComments() {
            document.getElementById('comment-modal').classList.remove('open');
        }

        function renderCommentsList() {
            const commentListEl = document.getElementById('comment-list');
            const comments = videos[currentVideoIndex].comments || [];
            commentListEl.innerHTML = comments.length ? comments.map(c => `<div class="comment-bubble">${c}</div>`).join('') : '<p style="color:var(--text-secondary); text-align:center; padding-top:20px;">هنوز نظری ثبت نشده است.</p>';
        }

        function submitComment() {
            const inputEl = document.getElementById('new-comment-text');
            const text = inputEl.value.trim();
            if(!text) return;
            if(!videos[currentVideoIndex].comments) videos[currentVideoIndex].comments = [];
            videos[currentVideoIndex].comments.push(text);
            inputEl.value = '';
            saveData();
            renderCommentsList();
            renderFeed();
        }

        // آپلود ویدیوی جدید
        function addNewVideo() {
            const title = document.getElementById('v-title').value.trim();
            const url = document.getElementById('v-url').value.trim();
            const category = document.getElementById('v-cat').value;

            if(!title || !url) {
                alert("لطفاً عنوان و لینک ویدیو را وارد کنید.");
                return;
            }

            videos.unshift({ title, url, category, likes: 0, comments: [] });
            saveData();
            document.getElementById('v-title').value = '';
            document.getElementById('v-url').value = '';
            switchPage('feed', document.querySelector('.nav-item'));
            renderFeed();
        }

        // اتصال واقعی کیف پول متامسک با ethers.js
        async function connectWallet() {
            if (window.ethereum) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    signer = provider.getSigner();
                    userSettings.wallet = accounts[0];
                    saveData();
                    updateWalletUI(accounts[0]);
                    alert("کیف پول با موفقیت متصل شد!");
                } catch (err) {
                    alert("اتصال کیف پول توسط کاربر لغو شد.");
                }
            } else {
                alert("لطفاً افزونه MetaMask را روی مرورگر خود نصب کنید.");
            }
        }

        function updateWalletUI(address) {
            const shortAddr = `${address.substring(0,6)}...${address.substring(38)}`;
            document.getElementById('wallet-status').innerText = `متصل: ${shortAddr}`;
            document.getElementById('wallet-btn').innerText = 'کیف پول متصل است';
            document.getElementById('wallet-btn').style.background = '#10b981';
        }

        // حمایت مالی واقعی بلاکچین
        async function donateETH() {
            if (!window.ethereum) {
                alert("لطفاً ابتدا متامسک را نصب کنید.");
                return;
            }
            try {
                provider = new ethers.providers.Web3Provider(window.ethereum);
                signer = provider.getSigner();
                const tx = await signer.sendTransaction({
                    to: userSettings.wallet || "0x0000000000000000000000000000000000000000",
                    value: ethers.utils.parseEther("0.0001")
                });
                userSettings.donations = +(userSettings.donations + 0.0001).toFixed(4);
                saveData();
                updateStats();
                alert("تراکنش با موفقیت ارسال شد! هش تراکنش: " + tx.hash);
            } catch (err) {
                alert("خطا در انجام تراکنش: " + (err.message || "کاربر تراکنش را رد کرد"));
            }
        }

        // تنظیمات تم و نام کاربری
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            userSettings.theme = document.body.classList.contains('light-mode') ? 'light' : 'dark';
            saveData();
        }

        document.getElementById('username-input').addEventListener('input', (e) => {
            userSettings.name = e.target.value;
            saveData();
        });

        // به‌روزرسانی آمار داشبورد
        function updateStats() {
            document.getElementById('stat-videos').innerText = videos.length;
            const totalLikes = videos.reduce((acc, v) => acc + (v.likes || 0), 0);
            document.getElementById('stat-likes').innerText = totalLikes;
            document.getElementById('stat-donations').innerText = userSettings.donations;
        }

        // ذخیره‌سازی ابری محلی
        function saveData() {
            localStorage.setItem('scientific_videos', JSON.stringify(videos));
            localStorage.setItem('scientific_user', JSON.stringify(userSettings));
        }

        // اجرای اولیه برنامه
        initApp();
    </script>
</body>
</html>
