<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پایگاه حقیقت علمی | Scientific Truth Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Ethers.js for Web3 Integration -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: '#D4AF37',
                        darkBg: '#0b0f19',
                        cardBg: '#131c2e'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; background-color: #0b0f19; color: #ffffff; overflow-x: hidden; }
        .glass { background: rgba(19, 28, 46, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(212, 175, 55, 0.15); }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.08); }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-20">

    <!-- ۱. هدر بالا و تیکر اخبار گوگل -->
    <header class="fixed top-0 left-0 right-0 z-50 glass border-b border-gold/20">
        <!-- تیکر اخبار زنده با اتصال به گوگل -->
        <div class="bg-gold/10 border-b border-gold/10 py-1 px-4 overflow-hidden whitespace-nowrap text-[11px] text-gold flex items-center">
            <span class="bg-gold text-black px-2 py-0.5 rounded text-[9px] font-bold ml-3 shrink-0 flex items-center gap-1">
                <i class="fa-solid fa-satellite-dish animate-pulse"></i> اخبار زنده علمی
            </span>
            <div class="inline-block animate-marquee space-x-8 space-x-reverse cursor-pointer" onclick="openGoogleSearchTicker()">
                <span class="hover:underline">🚀 کشف سیاره جدید قابل سکونت توسط تلسکوپ جیمز وب (کلیک برای جستجو در گوگل)</span>
                <span class="hover:underline">🔬 موفقیت بزرگ در همجوشی هسته‌ای و تولید انرژی پاک پایدار</span>
                <span class="hover:underline">🌌 ثبت عمیق‌ترین تصویر از کهکشان‌های اولیه کیهان</span>
            </div>
        </div>

        <!-- نوار ناوبری بالای صفحه -->
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 rounded-xl bg-gold/20 border border-gold/40 flex items-center justify-center text-gold font-bold">
                    <i class="fa-solid fa-atom"></i>
                </div>
                <h1 class="text-sm font-black tracking-wider text-gold">حقیقت علمی</h1>
            </div>
            <!-- دکمه اتصال کیف پول واقعی Web3 -->
            <button onclick="connectRealWallet()" id="wallet-btn" class="glass px-3 py-1.5 rounded-xl text-xs flex items-center gap-2 text-gold border border-gold/30 hover:bg-gold/10 transition-all">
                <i class="fa-solid fa-wallet"></i>
                <span id="user-wallet-display">اتصال کیف پول</span>
            </button>
        </div>
    </header>

    <!-- ۲. محتوای اصلی داینامیک (SPA Container) -->
    <main id="app-content" class="mt-24 max-w-md mx-auto w-full px-4 flex-1">
        <!-- محتوا توسط جاوااسکریپت رندر می‌شود -->
    </main>

    <!-- ۳. منوی ناوبری پایین صفحه -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 glass border-t border-gold/20 py-3 px-6">
        <div class="max-w-md mx-auto flex justify-between items-center text-gray-400">
            <button onclick="switchView('feed')" id="nav-feed" class="flex flex-col items-center gap-1 text-gold transition-all">
                <i class="fa-solid fa-fire text-lg"></i>
                <span class="text-[10px]">فید و ویدئو</span>
            </button>
            <button onclick="switchView('explore')" id="nav-explore" class="flex flex-col items-center gap-1 hover:text-gold transition-all">
                <i class="fa-solid fa-compass text-lg"></i>
                <span class="text-[10px]">اکسپلور</span>
            </button>
            <button onclick="switchView('upload')" id="nav-upload" class="flex flex-col items-center gap-1 hover:text-gold transition-all">
                <i class="fa-solid fa-circle-plus text-2xl text-gold"></i>
            </button>
            <button onclick="switchView('ai')" id="nav-ai" class="flex flex-col items-center gap-1 hover:text-gold transition-all">
                <i class="fa-solid fa-brain text-lg"></i>
                <span class="text-[10px]">هوش مصنوعی</span>
            </button>
            <button onclick="switchView('profile')" id="nav-profile" class="flex flex-col items-center gap-1 hover:text-gold transition-all">
                <i class="fa-solid fa-user text-lg"></i>
                <span class="text-[10px]">پروفایل</span>
            </button>
        </div>
    </nav>

    <!-- اسکریپت‌های جامع برنامه و اتصالات واقعی -->
    <script>
        // ساختار سراسری وضعیت برنامه (State Management)
        let STATE = {
            currentView: 'feed',
            user: {
                username: 'پژوهشگر علمی',
                wallet: null,
                bio: 'علاقمند به کیهان‌شناسی، فیزیک کوانتوم و حقیقت‌های علمی جهان.',
                avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80',
                interests: ['فیزیک کوانتوم', 'کیهان‌شناسی', 'هوش مصنوعی', 'زیست‌شناسی مولکولی'],
                ownedVideos: []
            },
            videos: [
                {
                    id: 1,
                    title: 'اسرار تاریک سیاه‌چاله‌ها و خمیدگی فضا-زمان',
                    category: 'کیهان‌شناسی',
                    videoUrl: 'https://www.w3schools.com/html/mov_bbb.mp4',
                    author: 'دکتر آوا رضایی',
                    authorWallet: '0x71C97F38A8b0e8b15276e0586e9eE946A92f1530',
                    price: '0.001', // ETH
                    likes: 1240,
                    comments: 85
                },
                {
                    id: 2,
                    title: 'مکانیک کوانتوم در زندگی روزمره و کامپیوترهای کوانتومی',
                    category: 'فیزیک کوانتوم',
                    videoUrl: 'https://www.w3schools.com/html/mov_bbb.mp4',
                    author: 'پروفسور کاظمی',
                    authorWallet: '0x71C97F38A8b0e8b15276e0586e9eE946A92f1530',
                    price: '0.0005', // ETH
                    likes: 950,
                    comments: 42
                }
            ],
            aiChats: []
        };

        // ذخیره و بازیابی از localStorage
        function saveToLocalStorage() {
            localStorage.setItem('scientific_truth_state', JSON.stringify(STATE));
        }

        // مدیریت تغییر صفحات (SPA Router)
        function switchView(viewName) {
            STATE.currentView = viewName;
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('text-gold'));
            const activeBtn = document.getElementById(`nav-${viewName}`);
            if (activeBtn) activeBtn.classList.add('text-gold');

            const container = document.getElementById('app-content');
            container.innerHTML = '';

            if (viewName === 'feed') renderFeed(container);
            else if (viewName === 'explore') renderExplore(container);
            else if (viewName === 'upload') renderUpload(container);
            else if (viewName === 'ai') renderAI(container);
            else if (viewName === 'profile') renderProfile(container);
        }

        // اتصال واقعی کیف پول Web3 (MetaMask / Trust Wallet)
        async function connectRealWallet() {
            if (!window.ethereum) {
                showToast("لطفاً افزونه کیف پول متامسک را نصب کنید.");
                return;
            }
            try {
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                const accounts = await provider.send("eth_requestAccounts", []);
                if (accounts.length > 0) {
                    STATE.user.wallet = accounts[0];
                    STATE.user.username = accounts[0].substring(0, 6) + '...' + accounts[0].substring(38);
                    document.getElementById('user-wallet-display').innerText = STATE.user.username;
                    saveToLocalStorage();
                    showToast("کیف پول با موفقیت متصل شد!");
                }
            } catch (err) {
                console.error("Wallet connection error:", err);
                showToast("اتصال کیف پول لغو شد.");
            }
        }

        // تراکنش واقعی خرید ویدئو با اتریوم
        async function buyVideoReal(videoId) {
            const video = STATE.videos.find(v => v.id === videoId);
            if (!video) return;

            if (!window.ethereum) {
                showToast("لطفاً کیف پول متامسک را نصب کنید.");
                return;
            }

            try {
                showToast("در حال اتصال به شبکه بلاکچین...");
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                const signer = provider.getSigner();

                const priceInWei = ethers.utils.parseEther(video.price.toString());
                showToast("لطفاً تراکنش را در کیف پول تایید کنید...");

                const tx = await signer.sendTransaction({
                    to: video.authorWallet,
                    value: priceInWei
                });

                showToast("تراکنش ارسال شد. منتظر تایید بلاکچین...");
                await tx.wait();

                STATE.user.ownedVideos.push(videoId);
                saveToLocalStorage();
                showToast("خرید ویدئو با موفقیت در بلاکچین ثبت شد!");
                switchView('feed');
            } catch (error) {
                console.error("Transaction failed:", error);
                showToast("تراکنش لغو شد یا با خطا مواجه شد.");
            }
        }

        // رندر کردن فید ویدئوها (مشابه Reels)
        function renderFeed(container) {
            container.innerHTML = `
                <div class="space-y-6 pb-12">
                    ${STATE.videos.map(video => {
                        const isOwned = STATE.user.ownedVideos.includes(video.id);
                        return `
                            <div class="glass rounded-3xl overflow-hidden border border-gold/20 shadow-2xl">
                                <div class="relative bg-black aspect-[9/16] flex items-center justify-center">
                                    <video src="${video.videoUrl}" controls class="w-full h-full object-cover"></video>
                                    <div class="absolute top-4 right-4 bg-black/60 backdrop-blur-md px-3 py-1 rounded-full text-[10px] text-gold border border-gold/30">
                                        ${video.category}
                                    </div>
                                </div>
                                <div class="p-4 space-y-3">
                                    <div class="flex items-center justify-between">
                                        <span class="text-xs text-gray-400"><i class="fa-solid fa-user-pen ml-1"></i> ${video.author}</span>
                                        <span class="text-xs text-gold font-bold">${video.price} ETH</span>
                                    </div>
                                    <h2 class="text-sm font-bold text-white">${video.title}</h2>
                                    <div class="flex items-center justify-between pt-2 border-t border-white/10">
                                        <div class="flex gap-4 text-xs text-gray-300">
                                            <span><i class="fa-solid fa-heart text-red-500 ml-1"></i> ${video.likes}</span>
                                            <span><i class="fa-solid fa-comment ml-1"></i> ${video.comments}</span>
                                        </div>
                                        ${isOwned ? `
                                            <span class="bg-green-500/20 text-green-400 px-4 py-1.5 rounded-xl text-xs font-bold border border-green-500/30">
                                                <i class="fa-solid fa-check ml-1"></i> خریداری شده
                                            </span>
                                        ` : `
                                            <button onclick="buyVideoReal(${video.id})" class="bg-gold text-black px-4 py-1.5 rounded-xl text-xs font-bold hover:bg-gold/80 transition-all shadow-lg">
                                                خرید ویدئو (Web3)
                                            </button>
                                        `}
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        // اکسپلور و جستجوی درون برنامه‌ای
        function renderExplore(container) {
            container.innerHTML = `
                <div class="space-y-4">
                    <div class="relative">
                        <input type="text" placeholder="جستجو در مقالات، ویدئوها و حوزه‌های علمی..." 
                               class="w-full glass bg-white/5 border border-white/10 rounded-2xl px-4 py-3 text-xs focus:border-gold outline-none pr-10">
                        <i class="fa-solid fa-search absolute right-4 top-4 text-gray-400"></i>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="glass p-4 rounded-2xl text-center cursor-pointer hover:border-gold transition-all" onclick="switchView('feed')">
                            <i class="fa-solid fa-atom text-gold text-xl mb-2"></i>
                            <h4 class="text-xs font-bold">فیزیک کوانتوم</h4>
                        </div>
                        <div class="glass p-4 rounded-2xl text-center cursor-pointer hover:border-gold transition-all" onclick="switchView('feed')">
                            <i class="fa-solid fa-globe text-gold text-xl mb-2"></i>
                            <h4 class="text-xs font-bold">کیهان‌شناسی</h4>
                        </div>
                    </div>
                </div>
            `;
        }

        // بخش آپلود ویدئو
        function renderUpload(container) {
            container.innerHTML = `
                <div class="glass p-6 rounded-3xl space-y-4">
                    <h3 class="text-sm font-bold text-gold text-center">انتشار ویدئوی علمی جدید</h3>
                    <input id="up-title" type="text" placeholder="عنوان علمی ویدئو..." class="w-full bg-white/5 border border-white/10 rounded-2xl p-3 text-xs outline-none focus:border-gold">
                    <input id="up-cat" type="text" placeholder="حوزه علمی (مثلاً فیزیک، نجوم)..." class="w-full bg-white/5 border border-white/10 rounded-2xl p-3 text-xs outline-none focus:border-gold">
                    <input id="up-price" type="text" placeholder="قیمت به ETH (مثلاً 0.001)..." class="w-full bg-white/5 border border-white/10 rounded-2xl p-3 text-xs outline-none focus:border-gold">
                    <input id="up-url" type="text" placeholder="لینک مستقیم ویدئو (MP4)..." class="w-full bg-white/5 border border-white/10 rounded-2xl p-3 text-xs outline-none focus:border-gold">
                    <button onclick="handleVideoUpload()" class="w-full bg-gold text-black py-3 rounded-2xl text-xs font-bold">انتشار در پایگاه حقیقت</button>
                </div>
            `;
        }

        function handleVideoUpload() {
            const title = document.getElementById('up-title').value;
            const category = document.getElementById('up-cat').value;
            const price = document.getElementById('up-price').value;
            const videoUrl = document.getElementById('up-url').value;

            if (!title || !videoUrl) {
                showToast("لطفاً عنوان و لینک ویدئو را وارد کنید.");
                return;
            }

            STATE.videos.unshift({
                id: Date.now(),
                title, category: category || 'عمومی',
                videoUrl,
                author: STATE.user.username,
                authorWallet: STATE.user.wallet || '0x71C97F38A8b0e8b15276e0586e9eE946A92f1530',
                price: price || '0',
                likes: 0,
                comments: 0
            });
            saveToLocalStorage();
            showToast("ویدئو با موفقیت منتشر شد!");
            switchView('feed');
        }

        // هوش مصنوعی واقعی با اتصال به OpenAI / OpenRouter API
        function renderAI(container) {
            container.innerHTML = `
                <div class="flex flex-col h-[calc(100vh-180px)]">
                    <div class="glass p-3 rounded-2xl mb-3 flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-brain text-gold"></i>
                            <span class="text-xs font-bold text-gold">دستیار هوشمند حقیقت‌یاب</span>
                        </div>
                        <button onclick="setAIApiKey()" class="text-[10px] text-gray-400 hover:text-gold underline">تنظیم API Key</button>
                    </div>
                    <div id="ai-chat-box" class="flex-1 overflow-y-auto space-y-3 pr-2 mb-3">
                        ${STATE.aiChats.length > 0 ? STATE.aiChats.map(c => `
                            <div class="flex flex-col ${c.sender === 'user' ? 'items-end' : 'items-start'}">
                                <div class="max-w-[85%] p-3 rounded-2xl text-xs ${c.sender === 'user' ? 'bg-gold text-black rounded-bl-none' : 'glass text-white rounded-br-none'}">
                                    ${c.message}
                                </div>
                            </div>
                        `).join('') : '<div class="text-center py-20 text-gray-500 text-xs">سؤال علمی خود را بپرسید...</div>'}
                    </div>
                    <div class="flex gap-2">
                        <input id="ai-input" type="text" placeholder="پرسش علمی..." class="flex-1 bg-white/5 border border-white/10 rounded-2xl px-4 py-3 text-xs outline-none focus:border-gold" onkeypress="if(event.key==='Enter') sendAIRealMessage()">
                        <button onclick="sendAIRealMessage()" class="w-12 h-12 bg-gold text-black rounded-2xl font-bold flex items-center justify-center"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                </div>
            `;
            const chatBox = document.getElementById('ai-chat-box');
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function setAIApiKey() {
            const key = prompt("لطفاً کلید API هوش مصنوعی (OpenAI / OpenRouter) خود را وارد کنید:");
            if (key) {
                localStorage.setItem('scientific_ai_key', key);
                showToast("کلید API با موفقیت ذخیره شد.");
            }
        }

        async function sendAIRealMessage() {
            const input = document.getElementById('ai-input');
            const message = input.value.trim();
            if (!message) return;

            const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            STATE.aiChats.push({ sender: 'user', message, time: timeNow });
            input.value = '';
            renderAI(document.getElementById('app-content'));

            const apiKey = localStorage.getItem('scientific_ai_key');
            if (!apiKey) {
                setAIApiKey();
                return;
            }

            try {
                const response = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: [
                            { role: "system", content: "You are an expert scientific assistant answering in Persian with deep academic rigor." },
                            { role: "user", content: message }
                        ]
                    })
                });

                const data = await response.json();
                const aiReply = data.choices && data.choices[0] ? data.choices[0].message.content : "خطا در دریافت پاسخ.";
                STATE.aiChats.push({ sender: 'ai', message: aiReply, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
                saveToLocalStorage();
                renderAI(document.getElementById('app-content'));
            } catch (err) {
                console.error(err);
                showToast("خطا در ارتباط با هوش مصنوعی.");
            }
        }

        // پروفایل کاربر
        function renderProfile(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="glass p-6 rounded-3xl text-center space-y-3">
                        <img src="${STATE.user.avatar}" class="w-20 h-20 rounded-full mx-auto border-2 border-gold object-cover">
                        <h3 class="text-sm font-bold text-gold">${STATE.user.username}</h3>
                        <p class="text-xs text-gray-400">${STATE.user.bio}</p>
                    </div>
                </div>
            `;
        }

        // توابع کمکی
        function showToast(text) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-20 left-1/2 -translate-x-1/2 glass bg-black/90 text-gold px-6 py-3 rounded-full text-xs z-50 shadow-2xl border border-gold/30';
            toast.innerText = text;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function openGoogleSearchTicker() {
            window.open('https://www.google.com/search?q=scientific+breakthroughs+james+webb', '_blank');
        }

        // راه‌اندازی اولیه
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('scientific_truth_state');
            if (saved) {
                try { STATE = JSON.parse(saved); } catch(e) {}
            }
            if (STATE.user.wallet) {
                document.getElementById('user-wallet-display').innerText = STATE.user.username;
            }
            switchView('feed');
        });
    </script>
</body>
</html>
