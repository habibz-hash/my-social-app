<!-- 
  MODULE: Web3 Core & Wallet Connection
  PURPOSE: Real-time connection to MetaMask/Trust Wallet, 
  User Identity Sync, and State Persistence.
-->

<!-- Dependencies: Tailwind CSS & Ethers.js -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>

<script>
/**
 * WEB3 CORE ENGINE
 * Responsible for wallet connection, identity management, and blockchain state.
 */
const Web3Engine = {
    provider: null,
    signer: null,
    userAddress: null,
    isWalletConnected: false,

    // Initialize the engine
    async init() {
        console.log("Initializing Web3 Engine...");
        this.loadPersistedState();
        this.setupEventListeners();
    },

    // Load user state from localStorage to prevent logout on refresh
    loadPersistedState() {
        const savedAddress = localStorage.getItem('web3_user_address');
        if (savedAddress) {
            this.userAddress = savedAddress;
            this.isWalletConnected = true;
            this.updateUIWithConnectedState(savedAddress);
            console.log("Restored session for:", savedAddress);
        }
    },

    // Event listeners for UI interaction
    setupEventListeners() {
        const connectBtn = document.getElementById('connect-wallet-btn');
        if (connectBtn) {
            connectBtn.addEventListener('click', () => this.connectWallet());
        }
    },

    // Main connection logic
    async connectWallet() {
        if (typeof window.ethereum !== 'undefined') {
            try {
                // Request account access
                this.provider = new ethers.providers.Web3Provider(window.ethereum);
                
                // Show loading state in UI (if element exists)
                this.toggleLoading(true);

                // Request accounts
                const accounts = await this.provider.send("eth_requestAccounts", []);
                this.userAddress = accounts[0];
                this.signer = this.provider.getSigner();
                this.isWalletConnected = true;

                // Persist identity
                localStorage.setItem('web3_user_address', this.userAddress);

                // Sync Identity: Set username to wallet address if first time
                this.syncUserIdentity(this.userAddress);

                // Update UI
                this.updateUIWithConnectedState(this.userAddress);
                
                console.log("Wallet connected successfully:", this.userAddress);
            } catch (error) {
                console.error("Connection failed:", error);
                alert("Connection rejected or failed. Please try again.");
            } finally {
                this.toggleLoading(false);
            }
        } else {
            alert("MetaMask or Trust Wallet not detected. Please install a Web3 wallet.");
        }
    },

    // Sync identity logic (Connecting Wallet to User Profile)
    syncUserIdentity(address) {
        // In a real production, this would call the Firebase API
        // For now, we sync it to the local state to maintain the 'Single Source of Truth'
        const userProfile = JSON.parse(localStorage.getItem('user_profile')) || {};
        
        if (!userProfile.username) {
            userProfile.username = address.substring(0, 6) + "..." + address.substring(38);
            localStorage.setItem('user_profile', JSON.stringify(userProfile));
        }
    },

    // UI Update Logic
    updateUIWithConnectedState(address) {
        const connectBtn = document.getElementById('connect-wallet-btn');
        const userDisplay = document.getElementById('user-address-display');
        const profileSection = document.getElementById('profile-section');

        if (connectBtn) {
            connectBtn.innerText = "Connected";
            connectBtn.classList.replace('bg-blue-600', 'bg-green-600');
            connectBtn.classList.replace('hover:bg-blue-700', 'hover:bg-green-700');
        }

        if (userDisplay) {
            userDisplay.innerText = address.substring(0, 6) + "..." + address.substring(38);
            userDisplay.classList.remove('hidden');
        }

        if (profileSection) {
            profileSection.classList.remove('hidden');
        }
    },

    // Helper for loading animations
    toggleLoading(isLoading) {
        const connectBtn = document.getElementById('connect-wallet-btn');
        if (connectBtn) {
            connectBtn.disabled = isLoading;
            connectBtn.innerText = isLoading ? "Connecting..." : "Connect Wallet";
        }
    },

    // Disconnect logic
    disconnect() {
        this.userAddress = null;
        this.isWalletConnected = false;
        this.signer = null;
        localStorage.removeItem('web3_user_address');
        location.reload(); // Reload to reset all engine states
    }
};

// Initialize immediately when the script loads
document.addEventListener('DOMContentLoaded', () => {
    Web3Engine.init();
});
</script>

<script>
/**
 * CONTENT & NFT ENGINE
 * Handles video uploads, metadata creation for NFTs, and royalty distribution logic.
 */
const ContentEngine = {
    videos: [],
    
    // Initialize Engine
    init() {
        console.log("Initializing Content & NFT Engine...");
        this.loadVideos();
        this.setupEventListeners();
    },

    // Load videos from local storage (simulating database for now)
    loadVideos() {
        const savedVideos = localStorage.getItem('platform_videos');
        this.videos = savedVideos ? JSON.parse(savedVideos) : [];
        console.log("Loaded videos:", this.videos.length);
    },

    // Save videos to local storage
    saveVideos() {
        localStorage.setItem('platform_videos', JSON.stringify(this.videos));
    },

    // Create a new video object with NFT metadata
    async createVideo(title, url, category, priceEth, isPremium) {
        if (!Web3Engine.isWalletConnected) {
            alert("You must connect your wallet to upload content.");
            return;
        }

        const newVideo = {
            id: Date.now(), // Unique ID
            title: title,
            url: url,
            category: category,
            owner: Web3Engine.userAddress,
            isPremium: isPremium,
            price: priceEth,
            // NFT Metadata Structure
            nftMetadata: {
                minted: false,
                royalty_creator: 0.70, // 70% to Creator
                royalty_platform: 0.30, // 30% to Owner (You)
                contract_address: "0x_PENDING_CONTRACT_ADDRESS" 
            },
            stats: {
                likes: 0,
                views: 0
            },
            timestamp: new Date().toISOString()
        };

        this.videos.unshift(newVideo); // Add to start of array
        this.saveVideos();
        console.log("Video and NFT Metadata prepared:", newVideo);
        return newVideo;
    },

    // Prepare the transaction for Minting (Simulating the NFT process)
    async prepareNFTMint(videoId) {
        const video = this.videos.find(v => v.id === videoId);
        if (!video) return;

        console.log(`Preparing NFT Minting for: ${video.title}`);
        
        // Logic to trigger MetaMask to call the Mint function on your Smart Contract
        // This is where we will integrate the real Smart Contract call in the final stage
        try {
            // Simulated Minting Process
            console.log("Calling Smart Contract: mintVideoNFT(...)");
            // In real implementation: 
            // const contract = new ethers.Contract(address, abi, Web3Engine.signer);
            // await contract.mintVideoNFT(video.id, { value: ethers.utils.parseEther(video.price.toString()) });
            
            video.nftMetadata.minted = true;
            this.saveVideos();
            alert("NFT Minted Successfully! Ownership is now recorded on-chain.");
        } catch (error) {
            console.error("Minting failed:", error);
            alert("Minting failed. Check your gas fees or wallet connection.");
        }
    },

    setupEventListeners() {
        // Event delegation for dynamic buttons (Like, Buy, Mint)
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('btn-mint')) {
                const vId = parseInt(e.target.getAttribute('data-id'));
                this.prepareNFTMint(vId);
            }
            if (e.target.classList.contains('btn-buy')) {
                const vId = parseInt(e.target.getAttribute('data-id'));
                this.processPurchase(vId);
            }
        });
    },

    // Handle the actual purchase and royalty split
    async processPurchase(videoId) {
        const video = this.videos.find(v => v.id === videoId);
        if (!video) return;

        console.log(`Initiating purchase for: ${video.title}`);
        
        try {
            // 1. Actual Blockchain Transaction (Real money transfer)
            // The smart contract will handle the 70/30 split automatically
            // Here we just trigger the transaction call
            const tx = {
                to: video.nftMetadata.contract_address,
                value: ethers.utils.parseEther(video.price.toString())
            };
            
            console.log("Transaction sent to blockchain:", tx);
            // await Web3Engine.signer.sendTransaction(tx); 
            
            alert(`Purchase successful! ${video.price} ETH sent. Royalties split: 70% Creator / 30% Platform.`);
            video.stats.views++;
            this.saveVideos();

        } catch (error) {
            console.error("Purchase failed:", error);
            alert("Transaction failed.");
        }
    }
};

// Initialize Engine
ContentEngine.init();
</script>

<!-- 
  MODULE: Main Engine Core
  PURPOSE: Integration of Web3, AI, Content, and UI Logic.
-->

<script>
/**
 * THE MASTER ENGINE
 * Orchestrates all sub-modules: Web3, AI, and Content.
 */
const AppEngine = {
    // 1. AI Logic Implementation
    ai: {
        apiKey: localStorage.getItem('ai_api_key') || null,
        async ask(question) {
            const chatBox = document.getElementById('ai-chat-box');
            if (!this.apiKey) {
                chatBox.innerHTML += `<p class="text-red-400 text-xs">خطا: لطفاً ابتدا API Key را تنظیم کنید.</p>`;
                return;
            }

            // Append User Question
            chatBox.innerHTML += `<p class="text-blue-400 text-xs font-bold">شما: ${question}</p>`;
            
            try {
                // Real API Call (Example using OpenAI/OpenRouter standard)
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${this.apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "model": "google/gemma-7b-it:free", // Using a free model for testing
                        "messages": [{"role": "user", "content": question}]
                    })
                });

                const data = await response.json();
                const reply = data.choices[0].message.content;

                // Append AI Reply
                chatBox.innerHTML += `<p class="text-emerald-400 text-xs">دستیار: ${reply}</p>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                chatBox.innerHTML += `<p class="text-red-400 text-xs">خطا در اتصال به هوش مصنوعی.</p>`;
            }
        }
    },

    // 2. Unified UI Controller
    ui: {
        renderVideos(videos) {
            const feed = document.getElementById('video-feed');
            if (!feed) return;
            
            if (videos.length === 0) {
                feed.innerHTML = `<div class="text-center text-slate-500 py-10">هنوز ویدئویی وجود ندارد. اولین باشید!</div>`;
                return;
            }

            feed.innerHTML = videos.map(v => `
                <div class="video-card glass rounded-3xl overflow-hidden shadow-2xl">
                    <div class="aspect-video bg-black relative">
                        <video class="w-full h-full object-cover" src="${v.url}" controls></video>
                        ${v.isPremium ? '<span class="absolute top-2 right-2 bg-amber-500 text-[10px] px-2 py-1 rounded-full font-bold text-black">Premium NFT</span>' : ''}
                    </div>
                    <div class="p-4">
                        <h3 class="font-bold text-lg mb-1">${v.title}</h3>
                        <div class="flex justify-between items-center text-xs text-slate-400 mb-4">
                            <span>دسته بندی: ${v.category}</span>
                            <span>${v.price} ETH</span>
                        </div>
                        <div class="flex gap-2">
                            ${v.nftMetadata.minted ? 
                                `<button class="flex-1 bg-emerald-600/20 text-emerald-400 py-2 rounded-xl text-xs font-bold border border-emerald-500/30">NFT مالکیت فعال</button>` : 
                                `<button class="flex-1 bg-blue-600 text-white py-2 rounded-xl text-xs font-bold btn-mint" data-id="${v.id}">ضرب NFT (Mint)</button>`
                            }
                            <button class="flex-1 bg-slate-700 py-2 rounded-xl text-xs btn-buy" data-id="${v.id}">خرید ویدئو</button>
                        </div>
                    </div>
                </div>
            `).join('');
        },

        updateNewsTicker(news) {
            const ticker = document.getElementById('ticker-content');
            if (ticker) ticker.innerText = news;
        }
    },

    // 3. Initialize Everything
    async start() {
        console.log("Engine Starting...");
        
        // Connect Web3Engine (From previous module)
        if (typeof Web3Engine !== 'undefined') {
            await Web3Engine.init();
            // If connected, sync UI
            if (Web3Engine.isWalletConnected) {
                this.ui.renderVideos(ContentEngine.videos);
            }
        }

        // Connect ContentEngine
        if (typeof ContentEngine !== 'undefined') {
            ContentEngine.init();
            this.ui.renderVideos(ContentEngine.videos);
        }

        this.setupGlobalListeners();
        this.initAI();
        this.initNews();
    },

    setupGlobalListeners() {
        // AI Send Button
        const aiSend = document.getElementById('ai-send-btn');
        const aiInput = document.getElementById('ai-input');
        if (aiSend && aiInput) {
            aiSend.onclick = () => {
                const q = aiInput.value.trim();
                if (q) {
                    this.ai.ask(q);
                    aiInput.value = '';
                }
            };
        }

        // API Key Setup
        const apiKeyBtn = document.getElementById('set-api-key');
        if (apiKeyBtn) {
            apiKeyBtn.onclick = () => {
                const key = prompt("لطفاً API Key خود را وارد کنید (مثلاً از OpenRouter):");
                if (key) {
                    this.ai.apiKey = key;
                    localStorage.setItem('ai_api_key', key);
                    alert("تنظیم شد!");
                }
            };
        }

        // Google Search Integration (Ticker Click)
        const ticker = document.getElementById('ticker-content');
        if (ticker) {
            ticker.onclick = () => {
                const query = prompt("چه چیزی را می‌خواهید در گوگل جستجو کنید؟");
                if (query) window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
            };
        }
    },

    initAI() {
        console.log("AI Module Ready.");
    },

    initNews() {
        // Simulated real-time news
        const newsItems = [
            "کشف سیاره‌ای جدید در کهکشان آندرومدا با احتمال وجود حیات!",
            "پیشرفت بزرگ در محاسبات کوانتومی توسط دانشمندان MIT",
            "بازار NFTها با ورود پروژه‌های علمی شاهد رشد چشمگیر است.",
            "پایگاه حقیقت علمی: مرجع اصلی دانش در دنیای Web3"
        ];
        let i = 0;
        setInterval(() => {
            this.ui.updateNewsTicker(newsItems[i]);
            i = (i + 1) % newsItems.length;
        }, 5000);
    }
};

// Boot the application
document.addEventListener('DOMContentLoaded', () => {
    AppEngine.start();
});
</script>
