<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Widows2030 | Reels</title>

<style>
:root {
    --bg: #050505;
    --card: #111;
    --text: #fff;
    --muted: #b8b8b8;
    --pink: #ff2d55;
    --purple: #833ab4;
    --orange: #fd1d1d;
    --blue: #0095f6;
    --nav-height: 68px;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: Tahoma, Arial, sans-serif;
    overflow: hidden;
}

button,
input,
textarea,
select {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.app {
    width: 100%;
    height: 100dvh;
    position: relative;
    background: #000;
}

.topbar {
    position: fixed;
    z-index: 20;
    top: 0;
    right: 0;
    left: 0;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    background: linear-gradient(to bottom, rgba(0,0,0,.75), transparent);
    pointer-events: none;
}

.topbar > * {
    pointer-events: auto;
}

.logo {
    font-size: 21px;
    font-weight: 900;
    letter-spacing: -1px;
    font-style: italic;
    background: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.top-button {
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 50%;
    color: #fff;
    background: rgba(255,255,255,.14);
    backdrop-filter: blur(10px);
    font-size: 20px;
}

.feed {
    width: 100%;
    height: 100dvh;
    overflow-y: auto;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
}

.feed::-webkit-scrollbar {
    display: none;
}

.reel {
    position: relative;
    width: 100%;
    height: 100dvh;
    min-height: 560px;
    overflow: hidden;
    scroll-snap-align: start;
    background:
        radial-gradient(circle at 50% 30%, #272727, #050505 70%);
}

.video-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #080808;
}

.video-wrap video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #080808;
}

.video-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 35px;
    text-align: center;
    color: #bbb;
    background:
        radial-gradient(circle at 30% 20%, rgba(214,41,118,.35), transparent 35%),
        radial-gradient(circle at 70% 80%, rgba(79,91,213,.35), transparent 35%),
        #0d0d0d;
}

.video-placeholder strong {
    display: block;
    margin-bottom: 10px;
    color: #fff;
    font-size: 18px;
}

.video-placeholder small {
    display: block;
    line-height: 1.8;
}

.reel::after {
    content: "";
    position: absolute;
    z-index: 1;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(to bottom, rgba(0,0,0,.45), transparent 25%),
        linear-gradient(to top, rgba(0,0,0,.9), transparent 45%);
}

.reel-header {
    position: absolute;
    z-index: 5;
    top: 67px;
    right: 15px;
    left: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.avatar {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    overflow: hidden;
    border: 2px solid #fff;
    border-radius: 50%;
    background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
    font-weight: 900;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.username {
    color: #fff;
    font-size: 14px;
    font-weight: bold;
    text-shadow: 0 1px 4px #000;
}

.follow-btn {
    margin-right: auto;
    padding: 6px 13px;
    border: 1px solid rgba(255,255,255,.7);
    border-radius: 8px;
    color: #fff;
    background: rgba(0,0,0,.28);
    font-size: 12px;
}

.reel-info {
    position: absolute;
    z-index: 5;
    right: 15px;
    bottom: calc(var(--nav-height) + 22px);
    width: calc(100% - 90px);
    text-shadow: 0 1px 5px #000;
}

.reel-title {
    margin: 0 0 9px;
    color: #fff;
    font-size: 18px;
    font-weight: 900;
}

.caption {
    margin: 0 0 10px;
    color: #f1f1f1;
    font-size: 13px;
    line-height: 1.8;
}

.category {
    display: inline-block;
    padding: 5px 10px;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 20px;
    color: #fff;
    background: rgba(255,255,255,.15);
    backdrop-filter: blur(8px);
    font-size: 11px;
}

.side-actions {
    position: absolute;
    z-index: 6;
    left: 13px;
    bottom: calc(var(--nav-height) + 24px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 17px;
}

.action {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    border: 0;
    color: #fff;
    background: transparent;
    text-shadow: 0 1px 5px #000;
}

.action .icon {
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: rgba(0,0,0,.24);
    backdrop-filter: blur(5px);
    font-size: 27px;
    transition: transform .2s, color .2s;
}

.action:active .icon {
    transform: scale(.82);
}

.action.liked .icon {
    color: #ff3040;
    animation: pop .28s ease;
}

.action-count {
    font-size: 11px;
    font-weight: bold;
}

@keyframes pop {
    50% { transform: scale(1.35); }
}

.bottom-nav {
    position: fixed;
    z-index: 30;
    right: 0;
    bottom: 0;
    left: 0;
    height: var(--nav-height);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    padding: 7px 10px max(7px, env(safe-area-inset-bottom));
    border-top: 1px solid rgba(255,255,255,.12);
    background: rgba(8,8,8,.86);
    backdrop-filter: blur(18px);
}

.nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    border: 0;
    color: #aaa;
    background: transparent;
    font-size: 10px;
}

.nav-item.active {
    color: #fff;
}

.nav-icon {
    font-size: 23px;
}

.nav-upload .nav-icon {
    width: 38px;
    height: 32px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    color: #000;
    background: linear-gradient(135deg, #feda75, #d62976, #4f5bd5);
    font-size: 25px;
    font-weight: bold;
}

.modal-backdrop {
    position: fixed;
    z-index: 100;
    inset: 0;
    display: none;
    align-items: flex-end;
    background: rgba(0,0,0,.65);
}

.modal-backdrop.show {
    display: flex;
}

.sheet {
    width: 100%;
    max-height: 86dvh;
    overflow-y: auto;
    padding: 18px 16px calc(20px + env(safe-area-inset-bottom));
    border-radius: 22px 22px 0 0;
    background: #181818;
    animation: slideUp .25s ease;
}

@keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
}

.sheet-handle {
    width: 42px;
    height: 5px;
    margin: -5px auto 17px;
    border-radius: 20px;
    background: #666;
}

.sheet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
}

.sheet-header h3 {
    margin: 0;
}

.close-btn {
    width: 34px;
    height: 34px;
    border: 0;
    border-radius: 50%;
    color: #fff;
    background: #333;
    font-size: 18px;
}

.comment-list {
    min-height: 80px;
    max-height: 42dvh;
    overflow-y: auto;
}

.comment {
    padding: 11px 0;
    border-bottom: 1px solid #2e2e2e;
    color: #eee;
    font-size: 14px;
    line-height: 1.7;
}

.comment small {
    display: block;
    margin-bottom: 2px;
    color: #999;
    font-size: 10px;
}

.comment-form {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.comment-form input {
    min-width: 0;
    flex: 1;
    padding: 12px;
    outline: none;
    border: 1px solid #3d3d3d;
    border-radius: 13px;
    color: #fff;
    background: #262626;
}

.primary-btn {
    padding: 0 17px;
    border: 0;
    border-radius: 13px;
    color: #fff;
    background: linear-gradient(135deg, #d62976, #833ab4);
    font-weight: bold;
}

.upload-sheet input,
.upload-sheet textarea,
.upload-sheet select {
    width: 100%;
    margin-bottom: 11px;
    padding: 13px;
    outline: none;
    border: 1px solid #3b3b3b;
    border-radius: 12px;
    color: #fff;
    background: #252525;
}

.upload-sheet textarea {
    min-height: 90px;
    resize: vertical;
}

.upload-sheet label {
    display: block;
    margin: 5px 0;
    color: #ccc;
    font-size: 12px;
}

.file-note {
    margin: 8px 0 15px;
    color: #ffcc66;
    font-size: 11px;
    line-height: 1.7;
}

.empty {
    padding: 50px 20px;
    text-align: center;
    color: #888;
}

.toast {
    position: fixed;
    z-index: 200;
    right: 50%;
    bottom: 83px;
    display: none;
    max-width: 90%;
    padding: 11px 16px;
    transform: translateX(50%);
    border-radius: 12px;
    color: #fff;
    background: #292929;
    box-shadow: 0 8px 30px #000;
    font-size: 12px;
}

.toast.show {
    display: block;
    animation: toastIn .25s ease;
}

@keyframes toastIn {
    from { opacity: 0; transform: translate(50%, 12px); }
    to { opacity: 1; transform: translate(50%, 0); }
}

@media (min-width: 700px) {
    .app {
        max-width: 470px;
        margin: auto;
        box-shadow: 0 0 70px rgba(214,41,118,.2);
    }

    .topbar,
    .bottom-nav {
        right: calc(50% - 235px);
        left: calc(50% - 235px);
    }

    .modal-backdrop {
        padding: 0 calc(50% - 235px);
    }
}
</style>
</head>

<body>
<div class="app">

    <header class="topbar">
        <div class="logo">Widows2030</div>
        <button class="top-button" onclick="showToast('برای جستجو از بخش پایین استفاده کنید')">⌕</button>
    </header>

    <main class="feed" id="feed"></main>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="scrollToTop()">
            <span class="nav-icon">⌂</span>
            <span>خانه</span>
        </button>

        <button class="nav-item" onclick="showToast('بخش جستجو به‌زودی فعال می‌شود')">
            <span class="nav-icon">⌕</span>
            <span>جستجو</span>
        </button>

        <button class="nav-item nav-upload" onclick="openUpload()">
            <span class="nav-icon">+</span>
            <span>انتشار</span>
        </button>

        <button class="nav-item" onclick="showToast('پروفایل سازنده Widows2030')">
            <span class="nav-icon">♙</span>
            <span>پروفایل</span>
        </button>
    </nav>
</div>

<!-- مودال کامنت‌ها -->
<div class="modal-backdrop" id="commentModal" onclick="closeOnBackdrop(event, 'commentModal')">
    <section class="sheet">
        <div class="sheet-handle"></div>

        <div class="sheet-header">
            <h3>نظرات</h3>
            <button class="close-btn" onclick="closeModal('commentModal')">×</button>
        </div>

        <div class="comment-list" id="commentList"></div>

        <form class="comment-form" onsubmit="submitComment(event)">
            <input id="commentInput" maxlength="300" placeholder="نظر خود را بنویسید..." required>
            <button class="primary-btn" type="submit">ثبت</button>
        </form>
    </section>
</div>

<!-- مودال انتشار -->
<div class="modal-backdrop" id="uploadModal" onclick="closeOnBackdrop(event, 'uploadModal')">
    <section class="sheet upload-sheet">
        <div class="sheet-handle"></div>

        <div class="sheet-header">
            <h3>انتشار ویدیو</h3>
            <button class="close-btn" onclick="closeModal('uploadModal')">×</button>
        </div>

        <form onsubmit="publishVideo(event)">
            <label for="videoUrl">لینک مستقیم ویدیو</label>
            <input id="videoUrl" type="url" placeholder="https://example.com/video.mp4">

            <label for="videoFile">یا انتخاب فایل از گالری</label>
            <input id="videoFile" type="file" accept="video/*">

            <div class="file-note">
                برای ماندگاری ویدیو بعد از رفرش، لینک مستقیم وارد کنید.
                فایل انتخاب‌شده فقط تا زمان باز بودن همین صفحه در دسترس است.
            </div>

            <label for="videoTitle">عنوان ویدیو</label>
            <input id="videoTitle" type="text" maxlength="100" placeholder="عنوان ویدیو" required>

            <label for="videoCaption">کپشن / توضیحات</label>
            <textarea id="videoCaption" maxlength="500" placeholder="توضیحات ویدیو..."></textarea>

            <label for="videoCategory">دسته‌بندی</label>
            <select id="videoCategory">
                <option value="علمی">علمی</option>
                <option value="آموزشی">آموزشی</option>
                <option value="سرگرمی">سرگرمی</option>
                <option value="فناوری">فناوری</option>
            </select>

            <button class="primary-btn" style="width:100%;height:46px" type="submit">
                انتشار ویدیو
            </button>
        </form>
    </section>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/*
    توجه:
    localStorage فقط اطلاعات متنی را ذخیره می‌کند.
    فایل‌های ویدیویی حجیم در localStorage ذخیره نمی‌شوند.
*/

const STORAGE_KEY = "widows2030_reels_v2";
const LIKE_KEY = "widows2030_liked_v2";

let videos = loadVideos();
let likedVideos = JSON.parse(localStorage.getItem(LIKE_KEY) || "[]");
let activeCommentVideoId = null;
let temporaryObjectUrls = [];

const sampleVideos = [
    {
        id: "sample-1",
        title: "آینده از همین‌جا شروع می‌شود",
        caption: "نگاهی کوتاه به فناوری‌هایی که زندگی ما را تغییر می‌دهند.",
        category: "فناوری",
        username: "widows2030",
        avatar: "W",
        videoUrl: "https://www.w3schools.com/html/mov_bbb.mp4",
        likes: 128,
        comments: [
            { user: "کاربر مهمان", text: "ویدیوی جذابی بود!" },
            { user: "علم‌دوست", text: "منتظر قسمت بعدی هستم." }
        ]
    },
    {
        id: "sample-2",
        title: "یک دقیقه با جهان علم",
        caption: "دانستن، اولین قدم برای ساختن آینده‌ای بهتر است.",
        category: "علمی",
        username: "science_daily",
        avatar: "S",
        videoUrl: "https://www.w3schools.com/html/movie.mp4",
        likes: 76,
        comments: [
            { user: "کاربر مهمان", text: "محتوای علمی بیشتر منتشر کنید." }
        ]
    }
];

function loadVideos() {
    const stored = localStorage.getItem(STORAGE_KEY);

    if (!stored) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(sampleVideos));
        return sampleVideos;
    }

    try {
        const parsed = JSON.parse(stored);
        return Array.isArray(parsed) ? parsed : sampleVideos;
    } catch {
        return sampleVideos;
    }
}

function saveVideos() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(videos));
}

function escapeHTML(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function isLiked(id) {
    return likedVideos.includes(id);
}

function renderFeed() {
    const feed = document.getElementById("feed");

    if (!videos.length) {
        feed.innerHTML = '<div class="empty">هنوز ویدیویی منتشر نشده است.</div>';
        return;
    }

    feed.innerHTML = videos.map(video => {
        const liked = isLiked(video.id);
        const hasUrl = Boolean(video.videoUrl);

        return `
            <article class="reel" data-id="${escapeHTML(video.id)}">
                <div class="video-wrap">
                    ${
                        hasUrl
                        ? `
                            <video
                                src="${escapeHTML(video.videoUrl)}"
                                controls
                                playsinline
                                loop
                                preload="metadata"
                                onclick="toggleVideo(this)">
                            </video>
                        `
                        : `
                            <div class="video-placeholder">
                                <div>
                                    <strong>لینک ویدیو در دسترس نیست</strong>
                                    <small>
                                        این ویدیو با انتخاب فایل محلی ساخته شده بود.
                                        برای پخش مجدد، فایل را دوباره انتخاب یا لینک مستقیم وارد کنید.
                                    </small>
                                </div>
                            </div>
                        `
                    }
                </div>

                <div class="reel-header">
                    <div class="avatar">${escapeHTML(video.avatar || "W")}</div>
                    <span class="username">@${escapeHTML(video.username || "widows2030")}</span>
                    <button class="follow-btn" onclick="showToast('دنبال‌کردن در نسخه بعدی فعال می‌شود')">
                        دنبال‌کردن
                    </button>
                </div>

                <div class="reel-info">
                    <h2 class="reel-title">${escapeHTML(video.title)}</h2>
                    <p class="caption">${escapeHTML(video.caption || "")}</p>
                    <span class="category">#${escapeHTML(video.category)}</span>
                </div>

                <div class="side-actions">
                    <button class="action ${liked ? "liked" : ""}" onclick="toggleLike('${escapeHTML(video.id)}')">
                        <span class="icon">♥</span>
                        <span class="action-count">${formatNumber(video.likes)}</span>
                    </button>

                    <button class="action" onclick="openComments('${escapeHTML(video.id)}')">
                        <span class="icon">◌</span>
                        <span class="action-count">${formatNumber(video.comments.length)}</span>
                    </button>

                    <button class="action" onclick="shareVideo('${escapeHTML(video.id)}')">
                        <span class="icon">➤</span>
                        <span class="action-count">اشتراک</span>
                    </button>
                </div>
            </article>
        `;
    });
}

function formatNumber(number) {
    return Number(number || 0).toLocaleString("fa-IR");
}

function toggleLike(id) {
    const video = videos.find(item => item.id === id);
    if (!video) return;

    if (isLiked(id)) {
        video.likes = Math.max(0, video.likes - 1);
        likedVideos = likedVideos.filter(item => item !== id);
    } else {
        video.likes++;
        likedVideos.push(id);
    }

    localStorage.setItem(LIKE_KEY, JSON.stringify(likedVideos));
    saveVideos();
    renderFeed();
}

function openComments(id) {
    activeCommentVideoId = id;
    const video = videos.find(item => item.id === id);
    if (!video) return;

    renderComments(video);
    document.getElementById("commentInput").value = "";
    document.getElementById("commentModal").classList.add("show");

    setTimeout(() => document.getElementById("commentInput").focus(), 250);
}

function renderComments(video) {
    const list = document.getElementById("commentList");

    if (!video.comments.length) {
        list.innerHTML = '<div class="empty">هنوز نظری ثبت نشده است.</div>';
        return;
    }

    list.innerHTML = video.comments.map(comment => `
        <div class="comment">
            <small>@${escapeHTML(comment.user || "کاربر مهمان")}</small>
            ${escapeHTML(comment.text)}
        </div>
    `).join("");
}

function submitComment(event) {
    event.preventDefault();

    const input = document.getElementById("commentInput");
    const text = input.value.trim();

    if (!text || !activeCommentVideoId) return;

    const video = videos.find(item => item.id === activeCommentVideoId);
    if (!video) return;

    video.comments.push({
        user: "کاربر مهمان",
        text
    });

    saveVideos();
    renderComments(video);
    renderFeed();
    input.value = "";
}

async function shareVideo(id) {
    const video = videos.find(item => item.id === id);
    if (!video) return;

    const shareData = {
        title: video.title,
        text: video.caption,
        url: video.videoUrl || location.href
    };

    try {
        if (navigator.share) {
            await navigator.share(shareData);
        } else {
            await navigator.clipboard.writeText(video.videoUrl || location.href);
            showToast("لینک کپی شد");
        }
    } catch {
        showToast("اشتراک‌گذاری لغو شد");
    }
}

function toggleVideo(video) {
    if (video.paused) {
        video.play().catch(() => {});
    } else {
        video.pause();
    }
}

function openUpload() {
    document.getElementById("uploadModal").classList.add("show");
}

function publishVideo(event) {
    event.preventDefault();

    const urlInput = document.getElementById("videoUrl");
    const fileInput = document.getElementById("videoFile");
    const title = document.getElementById("videoTitle").value.trim();
    const caption = document.getElementById("videoCaption").value.trim();
    const category = document.getElementById("videoCategory").value;

    const file = fileInput.files[0];
    let videoUrl = urlInput.value.trim();
    let temporary = false;

    if (!videoUrl && file) {
        videoUrl = URL.createObjectURL(file);
        temporaryObjectUrls.push(videoUrl);
        temporary = true;
    }

    if (!videoUrl) {
        showToast("لینک ویدیو یا فایل ویدیویی را انتخاب کنید");
        return;
    }

    const newVideo = {
        id: "video-" + Date.now(),
        title,
        caption,
        category,
        username: "widows2030",
        avatar: "W",
        videoUrl,
        likes: 0,
        comments: [],
        temporary
    };

    videos.unshift(newVideo);
    saveVideos();
    renderFeed();
    closeModal("uploadModal");
    event.target.reset();

    if (temporary) {
        showToast("ویدیو موقتاً اضافه شد؛ بعد از رفرش باید دوباره انتخاب شود");
    } else {
        showToast("ویدیو با موفقیت منتشر شد");
    }

    document.getElementById("feed").scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

function closeModal(id) {
    document.getElementById(id).classList.remove("show");

    if (id === "commentModal") {
        activeCommentVideoId = null;
    }
}

function closeOnBackdrop(event, id) {
    if (event.target.id === id) {
        closeModal(id);
    }
}

function scrollToTop() {
    document.getElementById("feed").scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

let toastTimer;

function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
        toast.classList.remove("show");
    }, 3000);
}

window.addEventListener("beforeunload", () => {
    temporaryObjectUrls.forEach(url => URL.revokeObjectURL(url));
});

renderFeed();
</script>
</body>
</html>
