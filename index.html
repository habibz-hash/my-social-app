<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widows2030 | پلتفرم اشتراک ویدیو</title>
    <style>
        :root { --primary: #ff9800; --bg: #121212; --card: #1e1e1e; --text: #ffffff; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Tahoma', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* استایل فرم آپلود */
        .upload-box { background: var(--card); padding: 25px; border-radius: 15px; border: 1px solid #333; margin-bottom: 30px; }
        input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; background: #333; color: white; box-sizing: border-box; }
        button { background: var(--primary); color: black; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        
        /* گالری */
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid #333; }
        video { width: 100%; border-radius: 8px; }
        
        /* بخش تعامل */
        .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .badge { background: #444; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; }
        .comments-section { margin-top: 15px; border-top: 1px solid #444; padding-top: 10px; }
        .comment-item { font-size: 0.85rem; color: #ccc; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <header style="text-align: center; margin-bottom: 30px;">
        <h1 style="color: var(--primary);">Widows2030</h1>
    </header>

    <div class="upload-box">
        <h3>آپلود ویدیوی جدید</h3>
        <input type="file" id="vidFile" accept="video/*">
        <input type="text" id="vidTitle" placeholder="عنوان ویدیو">
        <textarea id="vidDesc" placeholder="توضیحات ویدیو"></textarea>
        <select id="vidCategory">
            <option value="علمی">علمی</option>
            <option value="آموزشی">آموزشی</option>
            <option value="سرگرمی">سرگرمی</option>
            <option value="فناوری">فناوری</option>
        </select>
        <button onclick="addVideo()">انتشار ویدیو</button>
    </div>

    <div class="gallery" id="gallery"></div>
</div>

<script>
    let videos = JSON.parse(localStorage.getItem('myVideos')) || [];

    function saveAndRender() {
        localStorage.setItem('myVideos', JSON.stringify(videos));
        render();
    }

    function addVideo() {
        const fileInput = document.getElementById('vidFile');
        const title = document.getElementById('vidTitle').value;
        const desc = document.getElementById('vidDesc').value;
        const cat = document.getElementById('vidCategory').value;

        if (!fileInput.files[0] || !title) return alert("لطفاً فایل و عنوان را وارد کنید");

        const newVideo = {
            id: Date.now(),
            url: URL.createObjectURL(fileInput.files[0]),
            title, desc, cat,
            likes: 0,
            comments: []
        };

        videos.unshift(newVideo);
        saveAndRender();
        // پاک کردن فرم
        document.getElementById('vidTitle').value = '';
        document.getElementById('vidDesc').value = '';
    }

    function likeVideo(id) {
        const vid = videos.find(v => v.id === id);
        vid.likes++;
        saveAndRender();
    }

    function addComment(id) {
        const text = prompt("نظر خود را بنویسید:");
        if (text) {
            const vid = videos.find(v => v.id === id);
            vid.comments.push(text);
            saveAndRender();
        }
    }

    function render() {
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = '';
        videos.forEach(v => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
                <video src="${v.url}" controls></video>
                <h3>${v.title}</h3>
                <p style="font-size: 0.9rem; color: #aaa;">${v.desc}</p>
                <span class="badge">${v.cat}</span>
                <div class="actions">
                    <button style="width: auto;" onclick="likeVideo(${v.id})">❤️ ${v.likes}</button>
                    <button style="width: auto;" onclick="addComment(${v.id})">💬 نظر</button>
                </div>
                <div class="comments-section">
                    ${v.comments.map(c => `<div class="comment-item">👤 ${c}</div>`).join('')}
                </div>
            `;
            gallery.appendChild(div);
        });
    }

    render();
</script>

</body>
</html>
