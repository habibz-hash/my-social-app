<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widows2030 | پایگاه حقیقت علمی</title>
    <style>
        :root { --bg: #0a0a0c; --glass: rgba(255, 255, 255, 0.08); --accent: #00e5ff; --text: #e0e0e0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* لایه ناوبری */
        nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; z-index: 1000; }
        .nav-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }

        /* محتوا */
        .page { display: none; padding-bottom: 80px; }
        .active { display: block; }
        
        /* طراحی ویدیوها (Reels) */
        .reel-container { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
        .reel-item { height: 100vh; scroll-snap-align: start; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; position: relative; background: #000; }
        video { position: absolute; top:0; left:0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .ui-layer { z-index: 2; background: linear-gradient(transparent, rgba(0,0,0,0.8)); padding: 20px; border-radius: 20px; }

        /* فرم‌ها */
        .glass-panel { background: var(--glass); backdrop-filter: blur(10px); padding: 20px; border-radius: 20px; margin: 10px; border: 1px solid rgba(255,255,255,0.1); }
        input, textarea, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 10px; border: none; background: #222; color: #fff; }
        button { background: var(--accent); color: #000; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<!-- صفحات -->
<div id="feed-page" class="page active reel-container">
    <div id="video-feed"></div>
</div>

<div id="upload-page" class="page">
    <div class="glass-panel" style="margin-top: 50px;">
        <h2>آپلود داده علمی</h2>
        <input type="file" id="video-file" accept="video/*">
        <input type="text" id="video-title" placeholder="عنوان مقاله یا ویدیو">
        <button onclick="saveVideo()">ثبت در پایگاه</button>
    </div>
</div>

<!-- ناوبری -->
<nav>
    <button class="nav-btn" onclick="switchPage('feed-page')">🏠</button>
    <button class="nav-btn" onclick="switchPage('upload-page')">➕</button>
</nav>

<script>
    // --- مدیریت دیتابیس (IndexedDB) ---
    let db;
    const dbReq = indexedDB.open("WidowsDB", 1);
    dbReq.onupgradeneeded = e => {
        db = e.target.result;
        db.createObjectStore("videos", { keyPath: "id", autoIncrement: true });
    };
    dbReq.onsuccess = e => {
        db = e.target.result;
        loadVideos();
    };

    // --- عملیات اصلی ---
    function switchPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
    }

    function saveVideo() {
        const file = document.getElementById('video-file').files[0];
        const title = document.getElementById('video-title').value;
        const reader = new FileReader();

        reader.onload = e => {
            const transaction = db.transaction(["videos"], "readwrite");
            transaction.objectStore("videos").add({ title, video: e.target.result });
            alert("با موفقیت ثبت شد!");
            loadVideos();
        };
        reader.readAsDataURL(file);
    }

    function loadVideos() {
        const feed = document.getElementById('video-feed');
        feed.innerHTML = '';
        const transaction = db.transaction(["videos"], "readonly");
        const store = transaction.objectStore("videos");
        store.openCursor().onsuccess = e => {
            const cursor = e.target.result;
            if (cursor) {
                const v = cursor.value;
                feed.innerHTML += `
                    <div class="reel-item">
                        <video src="${v.video}" autoplay loop muted></video>
                        <div class="ui-layer">
                            <h2>${v.title}</h2>
                            <p>پایگاه حقیقت علمی | وضعیت: تایید شده</p>
                        </div>
                    </div>
                `;
                cursor.continue();
            }
        };
    }
</script>
</body>
</html>
