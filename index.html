<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Widows2030 | Enterprise Platform v7.0</title>
    <style>
        :root { 
            --dark: #09090b; --panel: #18181b; --neon: #22d3ee; 
            --accent: #8b5cf6; --text: #f4f4f5; --glass: rgba(255,255,255,0.05);
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; transition: 0.3s; }
        body { background: var(--dark); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar Navigation */
        nav { width: 240px; background: var(--panel); border-left: 1px solid #333; display: flex; flex-direction: column; padding: 20px; }
        nav h2 { color: var(--neon); font-size: 1.2rem; margin-bottom: 2rem; }
        nav div { padding: 12px; cursor: pointer; border-radius: 8px; margin-bottom: 5px; }
        nav div:hover { background: var(--glass); }

        /* Main Content */
        main { flex: 1; padding: 30px; overflow-y: auto; }
        .card { background: var(--panel); padding: 20px; border-radius: 12px; border: 1px solid #333; margin-bottom: 20px; }
        
        /* Stats Dashboard */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .stat-box { padding: 20px; background: var(--glass); border-radius: 10px; text-align: center; }
        
        /* Table Styles */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid #333; }
        
        /* UI Elements */
        input, button { padding: 10px; border-radius: 6px; border: 1px solid #444; background: #000; color: white; }
        button { background: var(--neon); color: #000; font-weight: bold; cursor: pointer; border: none; }
        button:hover { opacity: 0.8; }
    </style>
</head>
<body>

<nav>
    <h2>Widows2030</h2>
    <div onclick="UIEngine.render('dashboard')">📊 داشبورد</div>
    <div onclick="UIEngine.render('feed')">🌐 فید علمی</div>
    <div onclick="UIEngine.render('manage')">⚙️ مدیریت داده</div>
    <div onclick="UIEngine.render('upload')">➕ افزودن محتوا</div>
</nav>

<main id="app-root"></main>

<script>
/** 
 * WIDOWS CORE ENGINE - نسخه Enterprise
 * مدیریت دیتابیس و منطق برنامه 
 */
const WidowsCore = {
    db: null,
    async init() {
        return new Promise((resolve) => {
            const req = indexedDB.open("Widows2030_Enterprise", 1);
            req.onupgradeneeded = e => e.target.result.createObjectStore("records", { keyPath: "id", autoIncrement: true });
            req.onsuccess = e => { this.db = e.target.result; resolve(); };
        });
    },
    async getAll() {
        return new Promise(resolve => {
            const tx = this.db.transaction("records", "readonly");
            const req = tx.objectStore("records").getAll();
            req.onsuccess = () => resolve(req.result);
        });
    },
    async addRecord(data) {
        const tx = this.db.transaction("records", "readwrite");
        tx.objectStore("records").add({ ...data, date: new Date().toLocaleDateString('fa-IR') });
    },
    async deleteRecord(id) {
        const tx = this.db.transaction("records", "readwrite");
        tx.objectStore("records").delete(id);
    }
};

/**
 * UI ENGINE - موتور رندرینگ رابط کاربری
 */
const UIEngine = {
    root: document.getElementById('app-root'),
    
    async render(view) {
        this.root.innerHTML = "در حال بارگذاری...";
        const data = await WidowsCore.getAll();
        
        if(view === 'dashboard') {
            this.root.innerHTML = `
                <h2>داشبورد تحلیلی</h2>
                <div class="grid">
                    <div class="stat-box"><h3>تعداد مقالات</h3><p>${data.length}</p></div>
                    <div class="stat-box"><h3>میانگین اعتبار</h3><p>${data.length ? Math.round(data.reduce((a,b)=>a+b.score, 0)/data.length) : 0}%</p></div>
                </div>
            `;
        } 
        else if(view === 'manage') {
            this.root.innerHTML = `<h2>مدیریت رکوردهای علمی</h2><table id="data-table"><thead><tr><th>عنوان</th><th>امتیاز</th><th>عملیات</th></tr></thead><tbody></tbody></table>`;
            const tbody = document.querySelector('tbody');
            data.forEach(v => {
                tbody.innerHTML += `<tr><td>${v.title}</td><td>${v.score}%</td><td><button onclick="UIEngine.remove(${v.id})">حذف</button></td></tr>`;
            });
        }
        else if(view === 'upload') {
            this.root.innerHTML = `
                <div class="card">
                    <h2>ثبت محتوای جدید</h2>
                    <input id="in-title" style="width:100%; margin-bottom:10px;" placeholder="عنوان علمی...">
                    <input id="in-score" type="number" placeholder="امتیاز (0-100)">
                    <button onclick="UIEngine.submit()">ثبت در پایگاه</button>
                </div>
            `;
        }
    },

    async submit() {
        const title = document.getElementById('in-title').value;
        const score = parseInt(document.getElementById('in-score').value);
        await WidowsCore.addRecord({ title, score });
        alert("محتوا با موفقیت ثبت شد.");
        this.render('manage');
    },

    async remove(id) {
        await WidowsCore.deleteRecord(id);
        this.render('manage');
    }
};

// Start
WidowsCore.init().then(() => UIEngine.render('dashboard'));
</script>
</body>
</html>
