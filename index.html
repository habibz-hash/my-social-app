<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widows2030 | پایگاه حقیقت علمی</title>
    <style>
        /* استایل‌های پایه برای ظاهر مدرن */
        body { margin: 0; background: #000; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
        .reel { height: 100vh; width: 100%; scroll-snap-align: start; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .info { position: absolute; bottom: 20px; right: 20px; z-index: 10; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div id="feed"></div>

<script>
    /**
     * بخش تنظیمات (اینجا منبع داده شماست)
     * به جای ذخیره سازی در مرورگر، لینک ویدیوهای آپلود شده خود را اینجا وارد کنید.
     */
    const database = [
        {
            title: "تئوری کوانتوم به زبان ساده",
            src: "https://www.w3schools.com/html/mov_bbb.mp4",
            likes: 120
        },
        {
            title: "سفر در زمان: حقیقت یا خیال؟",
            src: "https://www.w3schools.com/html/movie.mp4",
            likes: 85
        }
    ];

    function initFeed() {
        const feed = document.getElementById('feed');
        database.forEach(item => {
            const reel = document.createElement('div');
            reel.className = 'reel';
            reel.innerHTML = `
                <video src="${item.src}" loop autoplay muted playsinline></video>
                <div class="info">
                    <h2>${item.title}</h2>
                    <p>❤️ ${item.likes} لایک</p>
                </div>
            `;
            feed.appendChild(reel);
        });
    }

    initFeed();
</script>
</body>
</html>
