        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700;900&display=swap');
        
        :root {
            --gold: #D4AF37;
            --glass: rgba(255, 255, 255, 0.05);
            --dark-bg: #050505;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--dark-bg);
            color: white;
            margin: 0;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

        /* Glassmorphism Utility */
        .glass {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .gold-text { color: var(--gold); }
        .gold-bg { background: linear-gradient(45deg, #D4AF37, #F9E076); }
        
        /* Animations */
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .float { animation: float 3s ease-in-out infinite; }

        /* Reels Layout */
        .reels-container {
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            height: 100vh;
        }
        .reel-item {
            scroll-snap-align: start;
            height: 100vh;
            position: relative;
        }

        /* News Ticker */
        .ticker-wrapper {
            overflow: hidden;
            white-space: nowrap;
            background: rgba(212, 175, 55, 0.1);
            border-bottom: 1px solid var(--gold);
        }
        .ticker-content {
            display: inline-block;
            animation: ticker 30s linear infinite;
        }
        @keyframes ticker {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* Loading Loader */
        .loader {
            border: 2px solid #f3f3f3;
            border-top: 2px solid var(--gold);
            border-radius: 50%;
            width: 14px;
            height: 14px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

// 1. VIEW SWITCHER ENGINE
function switchView(view) {
    STATE.currentView = view;
    const main = document.getElementById('main-view');
    
    // Update Nav UI
    document.querySelectorAll('nav button, .fixed.bottom-0 button').forEach(btn => {
        btn.classList.replace('text-gold', 'text-gray-400');
    });

    switch(view) {
        case 'feed':
            renderFeed();
            break;
        case 'search':
            renderSearch();
            break;
        case 'ai':
            renderAI();
            break;
        case 'profile':
            renderProfile();
            break;
        case 'explore':
            renderExplore();
            break;
    }
}

// 2. FEED VIEW (REELS STYLE)
function renderFeed() {
    const main = document.getElementById('main-view');
    main.innerHTML = `
        <div class="reels-container" id="reels-container">
            ${STATE.videos.map(v => `
                <div class="reel-item bg-black flex items-center justify-center">
                    <video class="h-full w-full object-cover" loop onclick="togglePlay(this)">
                        <source src="${v.url}" type="video/mp4">
                    </video>
                    
                    <!-- Overlay Info -->
                    <div class="absolute bottom-0 w-full p-6 bg-gradient-to-t from-black/80 to-transparent text-right">
                        <h3 class="text-lg font-bold mb-1">${v.title}</h3>
                        <p class="text-xs text-gray-300 mb-3">@{v.author}</p>
                        <div class="flex items-center gap-4 mb-4">
                            <span class="text-[10px] glass px-2 py-1 rounded-full"><i class="fa-solid fa-tag ml-1"></i>${v.category}</span>
                            ${v.isNFT ? '<span class="text-[10px] gold-text"><i class="fa-solid fa-gem ml-1"></i>NFT</span>' : ''}
                        </div>
                        <p class="text-xs text-gray-200 line-clamp-2 mb-4">${v.description}</p>
                        
                        <!-- Actions -->
                        <div class="flex justify-between items-center">
                            <div class="flex gap-4">
                                <button onclick="handleLike('${v.id}')" class="flex flex-col items-center gap-1 ${v.isLiked ? 'text-red-500' : 'text-white'}">
                                    <i class="fa-${v.isLiked ? 'solid' : 'regular'} fa-heart text-xl"></i>
                                    <span class="text-[10px]">${v.likes}</span>
                                </button>
                                <button onclick="openComments('${v.id}')" class="flex flex-col items-center gap-1 text-white">
                                    <i class="fa-solid fa-comment text-xl"></i>
                                    <span class="text-[10px]">${v.comments.length}</span>
                                </button>
                            </div>
                            <button onclick="buyVideo('${v.id}')" class="gold-bg text-black px-4 py-2 rounded-full text-xs font-bold">
                                ${v.price > 0 ? `خرید (${v.price} ETH)` : 'مشاهده رایگان'}
                            </button>
                        </div>
                    </div>
                </div>
            `).join('')}
        </div>
    `;
}

function togglePlay(video) {
    if (video.paused) video.play();
    else video.pause();
}

function handleLike(videoId) {
    const video = STATE.videos.find(v => v.id === videoId);
    if (video) {
        video.isLiked = !video.isLiked;
        video.likes += video.isLiked ? 1 : -1;
        renderFeed();
    }
}

// 1. WEB3 & WALLET LOGIC
async function showWalletModal() {
    const container = document.getElementById('modal-container');
    container.classList.remove('pointer-events-none');
    container.innerHTML = `
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="glass w-full max-w-xs rounded-3xl p-6 text-center">
                <h3 class="text-lg font-bold mb-6">اتصال به کیف پول</h3>
                <div class="space-y-4">
                    <button onclick="connectWallet('metamask')" class="w-full py-3 rounded-2xl bg-orange-500 text-white font-bold flex items-center justify-center gap-3">
                        <i class="fa-brands fa-ethereum text-xl"></i> MetaMask
                    </button>
                    <button onclick="connectWallet('trust')" class="w-full py-3 rounded-2xl bg-blue-600 text-white font-bold flex items-center justify-center gap-3">
                        <i class="fa-solid fa-shield-halved text-xl"></i> Trust Wallet
                    </button>
                    <button onclick="closeModal()" class="w-full py-2 text-gray-400 text-xs">لغو</button>
                </div>
            </div>
        </div>
    `;
}

async function connectWallet(type) {
    try {
        if (typeof window.ethereum !== 'undefined') {
            const provider = new ethers.providers.Web3Provider(window.ethereum);
            const accounts = await provider.send("eth_requestAccounts", []);
            STATE.user.isConnected = true;
            STATE.user.wallet = accounts[0];
            STATE.user.name = accounts[0].substring(0, 6) + '...' + accounts[0].substring(38);
            
            updateWalletUI();
            closeModal();
            alert(`به پلتفرم خوش آمدید! کیف پول متصل شد.`);
        } else {
            alert("کیف پول در این مرورگر پیدا نشد. لطفا از Metamask استفاده کنید.");
        }
    } catch (err) {
        console.error(err);
        alert("اتصال برقرار نشد.");
    }
}

function updateWalletUI() {
    const btn = document.getElementById('wallet-btn');
    if (STATE.user.isConnected) {
        btn.innerHTML = `<i class="fa-solid fa-check"></i> <span>${STATE.user.wallet.substring(0,6)}...</span>`;
        btn.classList.replace('gold-bg', 'bg-green-600');
        btn.classList.add('text-white');
    }
}

function disconnectWallet() {
    STATE.user.isConnected = false;
    STATE.user.wallet = null;
    location.reload(); // Reset state
}

// 2. AI ASSISTANT LOGIC (Simulated Advanced Response)
async function sendAiQuery() {
    const input = document.getElementById('ai-input');
    const query = input.value.trim();
    if (!query) return;

    const chatArea = document.getElementById('ai-chat-area');
    
    // Add User Message
    chatArea.innerHTML += `
        <div class="flex justify-end">
            <div class="bg-gold text-black px-4 py-3 rounded-2xl rounded-tl-none text-xs max-w-[85%] font-bold">
                ${query}
            </div>
        </div>
    `;
    input.value = '';
    chatArea.scrollTop = chatArea.scrollHeight;

    // Show Typing Indicator
    const typingId = 'typing-' + Date.now();
    chatArea.innerHTML += `
        <div id="${typingId}" class="flex justify-start">
            <div class="bg-white/5 px-4 py-3 rounded-2xl rounded-tl-none text-xs flex items-center gap-2">
                <div class="loader"></div> در حال تحلیل علمی...
            </div>
        </div>
    `;

    // Simulate AI Processing Delay
    setTimeout(() => {
        document.getElementById(typingId).remove();
        const response = getAiResponse(query);
        chatArea.innerHTML += `
            <div class="flex justify-start">
                <div class="bg-white/5 px-4 py-3 rounded-2xl rounded-tl-none text-xs max-w-[85%] leading-relaxed border border-gold/20">
                    ${response}
                </div>
            </div>
        `;
        chatArea.scrollTop = chatArea.scrollHeight;
    }, 1500);
}

function getAiResponse(query) {
    const q = query.toLowerCase();
    if (q.includes('سلام')) return "سلام! چطور می‌توانم در مسیر کشف حقیقت علمی به شما کمک کنم؟";
    if (q.includes('فضا') || q.includes('ستاره')) return "محیط فضا بسیار سرد و خلأ است. آیا می‌دانستید که در سیاهچاله‌ها زمان و مکان به شکلی کاملاً متفاوت عمل می‌کنند؟";
    if (q.includes('کوانتوم')) return "مکانیک کوانتومی دنیای ذرات زیراتمی است، جایی که یک ذره می‌تواند در دو مکان هم‌زمان باشد (برهم‌نهی)!";
    return "این یک فرضیه علمی جالب است. برای بررسی دقیق‌تر، باید داده‌های تجربی مربوط به این موضوع را در پایگاه داده‌های جهانی بررسی کنیم. آیا می‌خواهید درباره جنبه‌های دیگر این موضوع صحبت کنیم؟";
}

// 3. ECONOMY & NFT ENGINE
async function buyVideo(videoId) {
    const video = STATE.videos.find(v => v.id === videoId);
    if (!video) return;

    if (!STATE.user.isConnected) {
        alert("لطفاً ابتدا کیف پول خود را متصل کنید.");
        showWalletModal();
        return;
    }

    if (video.price > 0) {
        // Simulate Web3 Transaction
        alert(`درخواست تراکنش برای خرید NFT ویدئو: ${video.title}\nمبلغ: ${video.price} ETH\n(در حالت واقعی، تراکنش در شبکه Ethereum ارسال می‌شود)`);
        // Success logic
        STATE.user.ownedVideos.push(videoId);
        alert("تراکنش موفقیت‌آمیز بود! ویدئو به کتابخانه شما اضافه شد.");
    } else {
        alert("این ویدئو رایگان است. لذت ببرید!");
    }
}
