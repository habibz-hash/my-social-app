<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Widows2030 | پایگاه حقیقت علمی</title>
    <!-- قابلیت PWA برای نصب روی گوشی -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root { --accent: #7c5cff; --bg: #07080c; --text: #fff; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: Tahoma, sans-serif; }
        
        /* کلاس‌های کاربردی برای تغییر دیدگاه */
        .view { display: none; height: 100vh; overflow-y: auto; }
        .view.active { display: block; }

        /* استایل‌های جست‌وجو */
        .search-container { padding: 20px; background: #111; }
        .search-box { width: 100%; padding: 15px; border-radius: 20px; border: none; background: #222; color: #fff; }
        
        /* پروفایل عملیاتی */
        .profile-card { padding: 40px; text-align: center; }
        .profile-input { background: transparent; border: 1px solid #444; color: #fff; padding: 10px; width: 80%; border-radius: 10px; text-align: center; }
    </style>
</head>
<body>

    <!-- صفحه خانه (فید) -->
    <div id="view-home" class="view active">
        <div id="feed"></div>
    </div>

    <!-- صفحه جست‌وجو -->
    <div id="view-search" class="view">
        <div class="search-container">
            <input type="text" id="search-input" class="search-box" placeholder="جست‌وجو در پایگاه علمی...">
            <div id="search-results" style="margin-top:20px"></div>
            <button id="web-search-btn" style="display:none; width:100%; padding:15px; background:var(--accent); border:none; color:white; border-radius:10px; margin-top:10px;">جست‌وجو در گوگل</button>
        </div>
    </div>

    <!-- صفحه پروفایل -->
    <div id="view-profile" class="view">
        <div class="profile-card">
            <h2>پروفایل کاربری</h2>
            <input type="text" id="user-name" class="profile-input" placeholder="نام کاربری خود را وارد کنید">
            <button onclick="saveProfile()" style="margin-top:10px; padding:10px 20px;">ذخیره تغییرات</button>
        </div>
    </div>

    <!-- نویگیشن بار -->
    <nav style="position:fixed; bottom:0; width:100%; height:60px; background:#000; display:flex; justify-content:space-around; align-items:center; border-top:1px solid #333;">
        <button onclick="switchView('home')">🏠</button>
        <button onclick="switchView('search')">⌕</button>
        <button onclick="switchView('profile')">👤</button>
    </nav>

<script>
    // سیستم مدیریت وضعیت (State)
    const state = {
        user: localStorage.getItem('widows_user') || 'کاربر مهمان',
        videos: [
            { title: "سیاهچاله‌ها چیستند؟", tags: ["فضا", "نجوم"] },
            { title: "هوش مصنوعی و آینده", tags: ["فناوری", "علم"] }
        ]
    };

    // تعویض ویو (Navigation Logic)
    function switchView(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-' + viewId).classList.add('active');
    }

    // موتور جست‌وجوی دوگانه (هوشمند)
    document.getElementById('search-input').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const resultsDiv = document.getElementById('search-results');
        const webBtn = document.getElementById('web-search-btn');
        
        const filtered = state.videos.filter(v => v.title.toLowerCase().includes(query));
        
        if (filtered.length > 0) {
            resultsDiv.innerHTML = filtered.map(v => `<p style="padding:10px; border-bottom:1px solid #333">${v.title}</p>`).join('');
            webBtn.style.display = 'none';
        } else {
            resultsDiv.innerHTML = '<p>موردی یافت نشد.</p>';
            webBtn.style.display = 'block';
            webBtn.onclick = () => window.open(`https://www.google.com/search?q=${query}`, '_blank');
        }
    });

    // عملیات ذخیره‌سازی پروفایل
    function saveProfile() {
        const name = document.getElementById('user-name').value;
        localStorage.setItem('widows_user', name);
        alert('تغییرات ذخیره شد!');
    }

    // مقداردهی اولیه
    document.getElementById('user-name').value = state.user;
</script>
</body>
</html>
