<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پایگاه حقیقت علمی | اکوسیستم هوشمند</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #030508; color: #F3F4F6; margin: 0; overflow-x: hidden; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(15px); border: 1px solid rgba(212, 175, 55, 0.2); }
        .gold-text { color: #D4AF37; }
        .gold-bg { background: linear-gradient(135deg, #D4AF37, #F9E076); }
        .view-section { min-height: 100vh; padding-bottom: 100px; display: block; }
        .hidden { display: none !important; }
        .reel-video { width: 100%; height: 75vh; object-fit: cover; border-radius: 24px; background: #111; }
        .category-chip { transition: all 0.3s ease; cursor: pointer; white-space: nowrap; }
        .category-chip.active { background: #D4AF37; color: black; transform: scale(1.05); box-shadow: 0 0 15px rgba(212, 175, 55, 0.5); }
        .search-bar { transition: all 0.3s ease; }
        .search-bar:focus-within { width: 95%; border-color: #D4AF37; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .community-msg { animation: slideUp 0.4s ease-out; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 10px; }
    </style>
</head>
<body class="antialiased">

    <!-- 1. TOP NAVIGATION & SEARCH (Instagram Style) -->
    <header class="fixed top-0 left-0 right-0 z-[60] px-4 py-3 flex flex-col gap-3">
        <div class="flex justify-between items-center">
            <h1 class="text-lg font-bold gold-text">حقیقت علمی</h1>
            <div class="flex gap-4 text-gray-400">
                <i class="fa-solid fa-bell"></i>
                <i class="fa-solid fa-envelope"></i>
            </div>
        </div>
        <div class="search-bar glass rounded-full px-4 py-2 flex items-center gap-2">
            <i class="fa-solid fa-magnifying-glass text-gray-400 text-sm"></i>
            <input type="text" id="global-search" placeholder="جستجو در پلتفرم..." class="bg-transparent w-full text-xs outline-none text-white">
        </div>
    </header>

    <!-- 2. HORIZONTAL CATEGORIES (Interest Chips) -->
    <div class="fixed top-[110px] left-0 right-0 z-[55] overflow-x-auto px-4 py-2 no-scrollbar flex gap-2">
        <div onclick="filterCategory('همه')" class="category-chip active glass px-4 py-1 rounded-full text-xs" id="chip-همه">همه</div>
        <div onclick="filterCategory('علمی')" class="category-chip glass px-4 py-1 rounded-full text-xs" id="chip-علمی">علمی</div>
        <div onclick="filterCategory('سرگرمی')" class="category-chip glass px-4 py-1 rounded-full text-xs" id="chip-سرگرمی">سرگرمی</div>
        <div onclick="filterCategory('کمدی')" class="category-chip glass px-4 py-1 rounded-full text-xs" id="chip-کمدی">کمدی</div>
        <div onclick="filterCategory('بازی')" class="category-chip glass px-4 py-1 rounded-full text-xs" id="chip-بازی">بازی</div>
        <div onclick="filterCategory('ورزشی')" class="category-chip glass px-4 py-1 rounded-full text-xs" id="chip-ورزشی">ورزشی</div>
        <div onclick="filterCategory('خبری')" class="category-chip glass px-4 py-1 rounded-full text-xs" id="chip-خبری">خبری</div>
    </div>

    <main class="pt-[180px] px-4">
        
        <!-- VIEW: FEED -->
        <div id="view-feed" class="view-section">
            <div id="reels-container" class="space-y-8">
                <!-- Videos injected by JS -->
            </div>
        </div>

        <!-- VIEW: AI HUB -->
        <div id="view-ai" class="view-section hidden">
            <div class="glass rounded-3xl p-5 flex flex-col h-[65vh]">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-bold text-sm">هوش مصنوعی چندگانه</h2>
                    <select id="ai-selector" onchange="changeAI()" class="bg-black text-[10px] text-gold border border-gold/30 rounded-lg p-1 outline-none">
                        <option value="gpt6">GPT-6 (Deep Thinking)</option>
                        <option value="claude">Claude 3.5 (Creative)</option>
                        <option value="gemini">Gemini Pro (Fast)</option>
                    </select>
                </div>
                <div id="ai-chat-box" class="flex-1 overflow-y-auto space-y-4 pr-2 mb-4 text-xs"></div>
                <div class="flex gap-2">
                    <input type="text" id="ai-query" placeholder="سوال علمی بپرس..." class="flex-1 bg-black/50 border border-gray-800 rounded-xl p-3 text-xs outline-none">
                    <button onclick="askAI()" class="gold-bg text-black w-10 h-10 rounded-xl flex items-center justify-center"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

        <!-- VIEW: COMMUNITY -->
        <div id="view-community" class="view-section hidden">
            <div class="glass rounded-3xl p-4 h-[65vh] flex flex-col">
                <h2 class="font-bold text-center text-gold mb-4"><i class="fa-solid fa-comments ml-2"></i>تالار گفتگو</h2>
                <div id="community-messages" class="flex-1 overflow-y-auto space-y-4 mb-4 text-xs"></div>
                <div class="flex gap-2">
                    <input type="text" id="comm-input" placeholder="نظر خود را بنویسید..." class="flex-1 bg-black border border-gray-800 rounded-xl p-3 text-xs outline-none">
                    <button onclick="sendCommMessage()" class="gold-bg text-black px-4 rounded-xl font-bold text-xs">ارسال</button>
                </div>
            </div>
        </div>

        <!-- VIEW: UPLOAD -->
        <div id="view-upload" class="view-section hidden">
            <div class="glass rounded-3xl p-5 space-y-4">
                <h2 class="text-center font-bold text-gold">انتشار اثر (NFT)</h2>
                <input type="text" id="up-title" placeholder="عنوان اثر" class="w-full bg-black border border-gray-800 rounded-xl p-3 text-xs">
                <input type="text" id="up-url" placeholder="لینک ویدیو (MP4)" class="w-full bg-black border border-gray-800 rounded-xl p-3 text-xs">
                <select id="up-category" class="w-full bg-black border border-gray-800 rounded-xl p-3 text-xs outline-none">
                    <option value="علمی">علمی</option>
                    <option value="سرگرمی">سرگرمی</option>
                    <option value="کمدی">کمدی</option>
                    <option value="بازی">بازی</option>
                    <option value="ورزشی">ورزشی</option>
                    <option value="خبری">خبری</option>
                </select>
                <input type="number" id="up-price" placeholder="قیمت به ETH" class="w-full bg-black border border-gray-800 rounded-xl p-3 text-xs">
                <button onclick="mintNFT()" class="w-full gold-bg text-black font-bold py-3 rounded-xl mt-4">ضرب و انتشار</button>
            </div>
        </div>

        <!-- VIEW: PROFILE -->
        <div id="view-profile" class="view-section hidden">
            <div class="glass rounded-3xl p-6 text-center">
                <div class="w-20 h-20 bg-gold mx-auto rounded-full mb-4 flex items-center justify-center text-black text-3xl font-bold">U</div>
                <h2 id="profile-name" class="text-lg font-bold">کاربر علمی</h2>
                <p id="wallet-addr" class="text-[10px] text-gray-500 mb-6">عدم اتصال متامسک</p>
                
                <div class="text-right space-y-4">
                    <h3 class="text-xs font-bold text-gold">تنظیمات سلیقه (Interests):</h3>
                    <div id="interest-selector" class="flex flex-wrap gap-2">
                        <!-- Interests generated by JS -->
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="fixed bottom-0 left-0 right-0 z-[70] glass px-6 py-4 flex justify-around items-center border-t border-white/10">
        <button onclick="switchView('feed')" class="nav-btn text-gold" data-view="feed"><i class="fa-solid fa-play text-xl"></i></button>
        <button onclick="switchView('ai')" class="nav-btn text-gray-400" data-view="ai"><i class="fa-solid fa-brain text-xl"></i></button>
        <button onclick="switchView('community')" class="nav-btn text-gray-400" data-view="community"><i class="fa-solid fa-users text-xl"></i></button>
        <button onclick="switchView('upload')" class="nav-btn text-gray-400" data-view="upload"><i class="fa-solid fa-circle-plus text-xl"></i></button>
        <button onclick="switchView('profile')" class="nav-btn text-gray-400" data-view="profile"><i class="fa-solid fa-user text-xl"></i></button>
    </nav>

    <script>
        // DATA STATE
        let currentFilter = 'همه';
        let userInterests = JSON.parse(localStorage.getItem('user_interests')) || ['علمی', 'خبری'];
        let videos = JSON.parse(localStorage.getItem('science_v2_data')) || [
            { id: 1, title: 'راز سیاهچاله‌ها', author: 'دکتر فیزیک', url: 'https://assets.mixkit.co/videos/preview/mixkit-stars-in-space-background-1610-large.mp4', likes: 120, category: 'علمی' },
            { id: 2, title: 'خنده دارترین لحظات', author: 'کمدین برتر', url: 'https://assets.mixkit.co/videos/preview/mixkit-funny-cat-jumping-4271-large.mp4', likes: 450, category: 'کمدی' },
            { id: 3, title: 'هدف برتر فوتبال', author: 'اسطوره', url: 'https://assets.mixkit.co/videos/preview/mixkit-soccer-player-kicking-the-ball-41174-large.mp4', likes: 890, category: 'ورزشی' },
            { id: 4, title: 'آخرین اخبار جهان', author: 'خبرگزاری', url: 'https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-a-world-map-43410-large.mp4', likes: 300, category: 'خبری' }
        ];

        const allCategories = ['همه', 'علمی', 'سرگرمی', 'کمدی', 'بازی', 'ورزشی', 'خبری'];

        // VIEW CONTROLLER
        function switchView(view) {
            document.querySelectorAll('.view-section').forEach(s => s.classList.add('hidden'));
            document.getElementById('view-' + view).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('text-gold', 'text-gray-400'));
            const btn = document.querySelector(`[data-view="${view}"]`);
            if(btn) btn.classList.replace('text-gray-400', 'text-gold');

            if(view === 'feed') renderFeed();
            if(view === 'profile') renderProfile();
        }

        // FEED ENGINE (Personalized & Filtered)
        function renderFeed() {
            const container = document.getElementById('reels-container');
            container.innerHTML = '';
            
            // Filter by Category OR User Interest
            let filtered = videos.filter(v => {
                if (currentFilter === 'همه') {
                    // If "All", show videos that match User Interests first (Personalized)
                    return userInterests.includes(v.category) ? true : true; 
                }
                return v.category === currentFilter;
            });

            // Sort: Personal interests first
            filtered.sort((a, b) => {
                const aPref = userInterests.includes(a.category) ? 1 : 0;
                const bPref = userInterests.includes(b.category) ? 1 : 0;
                return bPref - aPref;
            });

            if(filtered.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 mt-20">ویدیویی در این دسته یافت نشد.</div>`;
                return;
            }

            filtered.forEach(v => {
                const div = document.createElement('div');
                div.className = 'relative';
                div.innerHTML = `
                    <video class="reel-video" src="${v.url}" loop muted playsinline onclick="this.paused ? this.play() : this.pause()"></video>
                    <div class="absolute bottom-10 right-4 text-right bg-black/40 p-2 rounded-xl">
                        <h3 class="font-bold text-white text-sm">${v.title}</h3>
                        <p class="text-xs text-gold">${v.author} | <span class="text-gray-300">${v.category}</span></p>
                    </div>
                    <div class="absolute left-4 bottom-20 flex flex-col gap-4">
                        <button class="w-10 h-10 glass rounded-full flex items-center justify-center"><i class="fa-solid fa-heart"></i></button>
                        <button class="w-10 h-10 glass rounded-full flex items-center justify-center"><i class="fa-solid fa-comment"></i></button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function filterCategory(cat) {
            currentFilter = cat;
            document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
            document.getElementById('chip-' + cat).classList.add('active');
            renderFeed();
        }

        // PROFILE & INTERESTS ENGINE
        function renderProfile() {
            const container = document.getElementById('interest-selector');
            container.innerHTML = '';
            
            allCategories.filter(c => c !== 'همه').forEach(cat => {
                const isSelected = userInterests.includes(cat);
                const chip = document.createElement('div');
                chip.className = `px-4 py-2 rounded-xl text-xs border ${isSelected ? 'border-gold bg-gold/20 text-gold' : 'border-gray-800 text-gray-500'} cursor-pointer`;
                chip.innerText = cat;
                chip.onclick = () => toggleInterest(cat);
                container.appendChild(chip);
            });
        }

        function toggleInterest(cat) {
            if(userInterests.includes(cat)) {
                userInterests = userInterests.filter(i => i !== cat);
            } else {
                userInterests.push(cat);
            }
            localStorage.setItem('user_interests', JSON.stringify(userInterests));
            renderProfile();
        }

        // AI ENGINE (Advanced)
        function askAI() {
            const query = document.getElementById('ai-query').value;
            const model = document.getElementById('ai-selector').value;
            if(!query) return;

            const box = document.getElementById('ai-chat-box');
            box.innerHTML += `<div class="bg-white/10 p-3 rounded-2xl rounded-tl-none text-gray-200 self-end ml-8">${query}</div>`;
            
            setTimeout(() => {
                const responses = {
                    gpt6: ["تحلیل عمیق انجام شد...", "بر اساس مدل GPT-6، نتیجه این است که...", "پارامترهای علمی تایید می‌شوند."],
                    claude: ["از نظر ادبی و علمی: ", "من این موضوع را اینگونه می‌بینم: ", "تحلیل خلاقانه: "],
                    gemini: ["گوگل گوگل میگوید: ", "بر اساس داده‌های جدید: ", "جستجو شد: "]
                };
                const r = responses[model][Math.floor(Math.random()*3)];
                box.innerHTML += `<div class="bg-gold/10 p-3 rounded-2xl rounded-tr-none text-gold ml-8">${r} ${query}</div>`;
                box.scrollTop = box.scrollHeight;
            }, 1000);
            document.getElementById('ai-query').value = '';
        }

        function changeAI() {
            const box = document.getElementById('ai-chat-box');
            box.innerHTML += `<div class="text-center text-[9px] text-gray-500 my-2">مدل به ${document.getElementById('ai-selector').value} تغییر یافت</div>`;
        }

        // COMMUNITY & UPLOAD
        function sendCommMessage() {
            const input = document.getElementById('comm-input');
            const container = document.getElementById('community-messages');
            if(!input.value) return;
            const div = document.createElement('div');
            div.className = 'bg-white/5 p-3 rounded-2xl community-msg text-xs';
            div.innerHTML = `<span class="text-gold font-bold">کاربر:</span> ${input.value}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            input.value = '';
        }

        async function mintNFT() {
            const title = document.getElementById('up-title').value;
            const url = document.getElementById('up-url').value;
            const cat = document.getElementById('up-category').value;
            if(!title || !url) return alert('لطفاً فیلدها را پر کنید');

            alert('در حال اتصال به بلاکچین...');
            setTimeout(() => {
                videos.unshift({ id: Date.now(), title, author: 'من', url, category: cat, likes: 0 });
                localStorage.setItem('science_v2_data', JSON.stringify(videos));
                alert('✅ با موفقیت منتشر شد!');
                switchView('feed');
            }, 1500);
        }

        window.onload = () => {
            renderFeed();
        };
    </script>
</body>
</html>
