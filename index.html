<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پایگاه حقیقت علمی</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            900: '#312e81'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome & Ethers.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .snap-y-mandatory { scroll-snap-type: y mandatory; }
        .snap-start { scroll-snap-align: start; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-white">

    <!-- Header / Navigation Top -->
    <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-500 to-indigo-400 flex items-center justify-center shadow-lg shadow-brand-500/30">
                <i class="fa-solid fa-atom text-white animate-spin" style="animation-duration: 10s;"></i>
            </div>
            <h1 class="font-black text-lg tracking-wide bg-gradient-to-r from-white via-indigo-200 to-brand-400 bg-clip-text text-transparent">حقیقت علمی</h1>
        </div>
        <div class="flex items-center gap-3">
            <button id="wallet-btn" onclick="connectWallet()" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-xs font-medium px-3 py-2 rounded-xl border border-slate-700 transition">
                <i class="fa-solid fa-wallet text-brand-400"></i>
                <span id="wallet-text">اتصال کیف پول</span>
            </button>
            <button onclick="toggleTheme()" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 flex items-center justify-center border border-slate-700 transition">
                <i id="theme-icon" class="fa-solid fa-sun text-amber-400"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Area (SPA Views) -->
    <main class="flex-1 pb-20 overflow-hidden relative">
        
        <!-- View 1: Reels Feed -->
        <section id="view-feed" class="view-section h-[calc(100vh-130px)] overflow-y-scroll snap-y-mandatory no-scrollbar relative">
            <div id="reels-container" class="w-full h-full">
                <!-- Dynamic Reels Inserted Here via JS -->
            </div>
        </section>

        <!-- View 2: Explore / Categories -->
        <section id="view-explore" class="view-section hidden p-4 max-w-xl mx-auto space-y-4">
            <div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
                <button onclick="filterCategory('all')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-medium bg-brand-600 text-white transition whitespace-nowrap">همه</button>
                <button onclick="filterCategory('نجوم')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 transition whitespace-nowrap">نجوم 🌌</button>
                <button onclick="filterCategory('فیزیک')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 transition whitespace-nowrap">فیزیک ⚡</button>
                <button onclick="filterCategory('زیست‌شناسی')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 transition whitespace-nowrap">زیست‌شناسی 🧬</button>
                <button onclick="filterCategory('هوش مصنوعی')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 transition whitespace-nowrap">هوش مصنوعی 🤖</button>
            </div>
            <div id="explore-grid" class="grid grid-cols-2 gap-3">
                <!-- Dynamic Explore Cards -->
            </div>
        </section>

        <!-- View 3: Upload Studio -->
        <section id="view-upload" class="view-section hidden p-4 max-w-md mx-auto">
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl space-y-4">
                <h2 class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-cloud-arrow-up text-brand-400"></i> انتشار ویدیوی علمی</h2>
                <form id="upload-form" onsubmit="handleUpload(event)" class="space-y-3">
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">عنوان ویدیو</label>
                        <input type="text" id="up-title" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">نام سازنده / کانال</label>
                        <input type="text" id="up-author" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">دسته‌بندی</label>
                        <select id="up-cat" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-brand-500">
                            <option value="نجوم">نجوم 🌌</option>
                            <option value="فیزیک">فیزیک ⚡</option>
                            <option value="زیست‌شناسی">زیست‌شناسی 🧬</option>
                            <option value="هوش مصنوعی">هوش مصنوعی 🤖</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">لینک ویدیو (MP4 مستقیم یا نمونه)</label>
                        <input type="url" id="up-url" required placeholder="https://..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-brand-500">
                    </div>
                    <button type="submit" class="w-full bg-brand-600 hover:bg-brand-500 text-white py-2.5 rounded-xl font-medium text-sm transition shadow-lg shadow-brand-600/30">انتشار در پایگاه</button>
                </form>
            </div>
        </section>

        <!-- View 4: Profile / Dashboard -->
        <section id="view-profile" class="view-section hidden p-4 max-w-md mx-auto space-y-4">
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl text-center space-y-3">
                <div class="w-20 h-20 bg-gradient-to-tr from-brand-600 to-indigo-400 rounded-full mx-auto flex items-center justify-center text-2xl font-bold shadow-xl shadow-brand-500/20">ع‌س</div>
                <h2 id="profile-name" class="font-bold text-lg">پژوهشگر گرامی</h2>
                <p id="profile-wallet" class="text-xs text-slate-400 font-mono bg-slate-950 py-1.5 px-3 rounded-lg inline-block">کیف پول متصل نیست</p>
            </div>
        </section>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur-md border-t border-slate-800 px-6 py-3 flex justify-around items-center z-50">
        <button onclick="switchView('feed')" class="nav-btn flex flex-col items-center gap-1 text-brand-400 transition" data-target="view-feed">
            <i class="fa-solid fa-clapperboard text-lg"></i>
            <span class="text-[10px]">فید</span>
        </button>
        <button onclick="switchView('explore')" class="nav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition" data-target="view-explore">
            <i class="fa-solid fa-compass text-lg"></i>
            <span class="text-[10px]">کاوش</span>
        </button>
        <button onclick="switchView('upload')" class="nav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition" data-target="view-upload">
            <i class="fa-solid fa-circle-plus text-lg"></i>
            <span class="text-[10px]">افزودن</span>
        </button>
        <button onclick="switchView('profile')" class="nav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition" data-target="view-profile">
            <i class="fa-solid fa-user-astronaut text-lg"></i>
            <span class="text-[10px]">پروفایل</span>
        </button>
    </nav>

    <!-- Comments Modal -->
    <div id="comments-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center">
        <div class="bg-slate-900 border border-slate-800 w-full sm:max-w-md h-[70vh] rounded-t-3xl sm:rounded-2xl flex flex-col overflow-hidden">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                <h3 class="font-bold text-sm">نظرات پژوهشگران</h3>
                <button onclick="closeComments()" class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="comments-list" class="flex-1 p-4 overflow-y-auto space-y-3 text-sm">
                <!-- Comments rendered here -->
            </div>
            <div class="p-3 border-t border-slate-800 bg-slate-950 flex gap-2">
                <input type="text" id="comment-input" placeholder="نظر علمی خود را بنویسید..." class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-brand-500">
                <button onclick="postComment()" class="bg-brand-600 hover:bg-brand-500 px-4 py-2 rounded-xl text-xs font-medium text-white transition">ارسال</button>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        let defaultVideos = [
            { id: 1, title: "اسرار سیاه‌چاله‌ها و خمیدگی فضا-زمان", author: "دکتر سمیعی", category: "نجوم", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4", likes: 142, comments: [{user: "علی", text: "بسیار جذاب بود!"}] },
            { id: 2, title: "مکانیک کوانتومی به زبان ساده", author: "پروفسور رضایی", category: "فیزیک", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4", likes: 389, comments: [] },
            { id: 3, title: "ژن‌درمانی و آینده پزشکی مدرن", author: "دکتر مهدوی", category: "زیست‌شناسی", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4", likes: 215, comments: [] }
        ];

        let videos = JSON.parse(localStorage.getItem('scientific_videos')) || defaultVideos;
        let currentActiveVideoId = null;
        let currentWalletAddress = localStorage.getItem('scientific_wallet') || null;

        function saveVideos() {
            localStorage.setItem('scientific_videos', JSON.stringify(videos));
        }

        function renderReels(filterCat = 'all') {
            const container = document.getElementById('reels-container');
            container.innerHTML = '';
            
            let filtered = filterCat === 'all' ? videos : videos.filter(v => v.category === filterCat);
            if(filtered.length === 0) {
                container.innerHTML = `<div class='h-full flex items-center justify-center text-slate-500 text-sm'>ویدیویی در این دسته یافت نشد.</div>`;
                return;
            }

            filtered.forEach(video => {
                let card = document.createElement('div');
                card.className = 'w-full h-full snap-start relative flex items-center justify-center bg-black';
                card.innerHTML = `
                    <video src="${video.url}" class="w-full h-full object-cover" loop playsinline onclick="togglePlay(this)"></video>
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-slate-900/30 pointer-events-none"></div>
                    <div class="absolute bottom-6 right-4 left-20 z-10 space-y-2 pointer-events-auto">
                        <span class="bg-brand-600/80 backdrop-blur-md text-[10px] px-2.5 py-1 rounded-full font-medium text-white">${video.category}</span>
                        <h3 class="font-bold text-sm text-white">${video.title}</h3>
                        <p class="text-xs text-slate-300">@${video.author}</p>
                    </div>
                    <div class="absolute bottom-6 left-4 z-10 flex flex-col items-center gap-4">
                        <button onclick="likeVideo(${video.id})" class="w-10 h-10 rounded-full bg-slate-900/60 backdrop-blur-md flex items-center justify-center text-rose-500 hover:scale-110 transition shadow-lg">
                            <i class="fa-solid fa-heart"></i>
                        </button>
                        <span class="text-xs font-bold text-white">${video.likes}</span>
                        <button onclick="openComments(${video.id})" class="w-10 h-10 rounded-full bg-slate-900/60 backdrop-blur-md flex items-center justify-center text-white hover:scale-110 transition shadow-lg">
                            <i class="fa-solid fa-comment"></i>
                        </button>
                        <span class="text-xs font-bold text-white">${video.comments.length}</span>
                        <button onclick="donateCrypto()" class="w-10 h-10 rounded-full bg-amber-500/80 backdrop-blur-md flex items-center justify-center text-white hover:scale-110 transition shadow-lg" title="حمایت مالی (Web3)">
                            <i class="fa-solid fa-coins"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });

            // Intersection Observer to auto-play active video
            observerVideos();
        }

        function observerVideos() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    if (video) {
                        if (entry.isIntersecting) {
                            video.play().catch(e => console.log("Auto-play blocked"));
                        } else {
                            video.pause();
                        }
                    }
                });
            }, { threshold: 0.6 });

            document.querySelectorAll('#reels-container > div').forEach(div => observer.observe(div));
        }

        function togglePlay(videoEl) {
            if (videoEl.paused) videoEl.play();
            else videoEl.pause();
        }

        function likeVideo(id) {
            let v = videos.find(item => item.id === id);
            if (v) {
                v.likes++;
                saveVideos();
                renderReels();
            }
        }

        function switchView(viewName) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(`view-${viewName}`).classList.remove('hidden');

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-brand-400');
                btn.classList.add('text-slate-400');
                if(btn.getAttribute('data-target') === `view-${viewName}`) {
                    btn.classList.remove('text-slate-400');
                    btn.classList.add('text-brand-400');
                }
            });

            if(viewName === 'explore') renderExplore();
            if(viewName === 'feed') renderReels();
        }

        function renderExplore(cat = 'all') {
            const grid = document.getElementById('explore-grid');
            grid.innerHTML = '';
            let filtered = cat === 'all' ? videos : videos.filter(v => v.category === cat);
            
            filtered.forEach(v => {
                let box = document.createElement('div');
                box.className = 'bg-slate-900 border border-slate-800 rounded-xl overflow-hidden p-3 space-y-2';
                box.innerHTML = `
                    <div class="h-28 bg-slate-950 rounded-lg overflow-hidden relative">
                        <video src="${v.url}" class="w-full h-full object-cover"></video>
                    </div>
                    <h4 class="font-bold text-xs line-clamp-1 text-white">${v.title}</h4>
                    <div class="flex justify-between items-center text-[10px] text-slate-400">
                        <span>@${v.author}</span>
                        <span><i class="fa-solid fa-heart text-rose-500"></i> ${v.likes}</span>
                    </div>
                `;
                grid.appendChild(box);
            });
        }

        function filterCategory(cat) {
            renderExplore(cat);
        }

        function handleUpload(e) {
            e.preventDefault();
            let newVid = {
                id: Date.now(),
                title: document.getElementById('up-title').value,
                author: document.getElementById('up-author').value,
                category: document.getElementById('up-cat').value,
                url: document.getElementById('up-url').value,
                likes: 0,
                comments: []
            };
            videos.unshift(newVid);
            saveVideos();
            alert('ویدیوی شما با موفقیت در پایگاه حقیقت علمی ثبت شد.');
            document.getElementById('upload-form').reset();
            switchView('feed');
        }

        async function connectWallet() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    const provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    const signer = provider.getSigner();
                    currentWalletAddress = await signer.getAddress();
                    localStorage.setItem('scientific_wallet', currentWalletAddress);
                    document.getElementById('wallet-text').innerText = currentWalletAddress.substring(0, 6) + '...' + currentWalletAddress.substring(38);
                    document.getElementById('profile-wallet').innerText = currentWalletAddress;
                } catch (err) {
                    console.error(err);
                }
            } else {
                alert('لطفاً افزونه کیف پول متامسک را نصب کنید.');
            }
        }

        async function donateCrypto() {
            if (!currentWalletAddress) {
                alert('لطفاً ابتدا کیف پول خود را متصل کنید.');
                await connectWallet();
                return;
            }
            try {
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                const signer = provider.getSigner();
                const tx = await signer.sendTransaction({
                    to: currentWalletAddress, // ارسال تست به خود یا سازنده
                    value: ethers.utils.parseEther("0.0001")
                });
                alert('تراکنش حمایت مالی ارسال شد! هش تراکنش: ' + tx.hash);
            } catch (err) {
                alert('تراکنش لغو شد یا خطایی رخ داد.');
            }
        }

        function openComments(id) {
            currentActiveVideoId = id;
            renderComments();
            document.getElementById('comments-modal').classList.remove('hidden');
        }

        function closeComments() {
            document.getElementById('comments-modal').classList.add('hidden');
        }

        function renderComments() {
            const list = document.getElementById('comments-list');
            list.innerHTML = '';
            let v = videos.find(item => item.id === currentActiveVideoId);
            if(!v || v.comments.length === 0) {
                list.innerHTML = `<div class='text-center text-slate-500 py-10'>هنوز نظری ثبت نشده است. اولین نفر باشید!</div>`;
                return;
            }
            v.comments.forEach(c => {
                let div = document.createElement('div');
                div.className = 'bg-slate-950 border border-slate-800/60 p-3 rounded-xl space-y-1';
                div.innerHTML = `<div class="font-bold text-xs text-brand-400">${c.user}</div><div class="text-xs text-slate-300">${c.text}</div>`;
                list.appendChild(div);
            });
        }

        function postComment() {
            let input = document.getElementById('comment-input');
            let text = input.value.trim();
            if(!text) return;
            let v = videos.find(item => item.id === currentActiveVideoId);
            if(v) {
                v.comments.push({ user: currentWalletAddress ? currentWalletAddress.substring(0,6) : 'پژوهشگر مهمان', text: text });
                saveVideos();
                input.value = '';
                renderComments();
                renderReels();
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.className = 'fa-solid fa-moon text-indigo-600';
            } else {
                html.classList.add('dark');
                icon.className = 'fa-solid fa-sun text-amber-400';
            }
        }

        // Initialize App on Load
        window.addEventListener('DOMContentLoaded', () => {
            renderReels();
            if(currentWalletAddress) {
                document.getElementById('wallet-text').innerText = currentWalletAddress.substring(0, 6) + '...' + currentWalletAddress.substring(38);
                document.getElementById('profile-wallet').innerText = currentWalletAddress;
            }
        });
    </script>
</body>
</html>
