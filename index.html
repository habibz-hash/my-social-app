<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پایگاه حقیقت علمی | پلتفرم اشتراک دانش</title>
    
    <!-- CDN Links -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #D4AF37;
            --dark-bg: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--dark-bg);
            color: white;
            margin: 0;
            overflow-x: hidden;
        }

        /* Glassmorphism Effect */
        .glass {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Google News Ticker Style */
        #news-ticker-container {
            width: 100%;
            height: 35px;
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 1px solid var(--gold);
            overflow: hidden;
            position: fixed;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
        }

        .ticker-wrap {
            white-space: nowrap;
            display: inline-block;
            padding-right: 100%;
            animation: ticker 60s linear infinite;
        }

        @keyframes ticker {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        .news-item {
            display: inline-block;
            padding: 0 30px;
            color: var(--gold);
            font-size: 0.8rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .news-item:hover {
            color: white;
            text-decoration: underline;
        }

        /* Profile Highlights Style */
        .highlight-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(45deg, #D4AF37, #f9d423, #ff4e50);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .highlight-inner {
            width: 100%;
            height: 100%;
            background: var(--dark-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 65px;
            z-index: 1000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Loader for AI */
        .loader {
            width: 18px;
            height: 18px;
            border: 2px solid var(--gold);
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Main Content Spacing to accommodate Ticker and Nav */
        main {
            margin-top: 35px;
            margin-bottom: 65px;
        }
    </style>
</head>
<body>

    <!-- 1. Google News Ticker (Top) -->
    <div id="news-ticker-container">
        <div class="ticker-wrap" id="ticker-content">
            <!-- محتوای اخبار از طریق JS تزریق می‌شود -->
        </div>
    </div>

    <!-- Modal Container for Alerts/Wallets/Uploads -->
    <div id="modal-container" class="fixed inset-0 z-[2000] pointer-events-none flex items-center justify-center"></div>

    <main id="app-content">
        <!-- بخش‌های مختلف (Feed, Profile, AI, Search) در اینجا توسط JS مدیریت می‌شوند -->
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav glass">
        <button onclick="switchView('feed')" class="nav-item flex flex-col items-center text-gold" id="nav-feed">
            <i class="fa-solid fa-house text-xl"></i>
            <span class="text-[10px] mt-1">خانه</span>
        </button>
        <button onclick="switchView('explore')" class="nav-item flex flex-col items-center text-gray-400" id="nav-explore">
            <i class="fa-solid fa-magnifying-glass text-xl"></i>
            <span class="text-[10px] mt-1">جستجو</span>
        </button>
        <button onclick="showUploadModal()" class="nav-item flex flex-col items-center text-gray-400" id="nav-upload">
            <i class="fa-solid fa-circle-plus text-3xl text-gold"></i>
        </button>
        <button onclick="switchView('ai')" class="nav-item flex flex-col items-center text-gray-400" id="nav-ai">
            <i class="fa-solid fa-robot text-xl"></i>
            <span class="text-[10px] mt-1">هوش مصنوعی</span>
        </button>
        <button onclick="switchView('profile')" class="nav-item flex flex-col items-center text-gray-400" id="nav-profile">
            <i class="fa-solid fa-user text-xl"></i>
            <span class="text-[10px] mt-1">پروفایل</span>
        </button>
    </nav>

    <!-- Wallet Button (Floating/Special) -->
    <button id="wallet-btn" onclick="showWalletModal()" class="fixed top-12 left-4 z-[1100] glass px-3 py-1.5 rounded-full text-[10px] flex items-center gap-2 border border-gold/30">
        <i class="fa-solid fa-wallet text-gold"></i>
        <span>اتصال ولت</span>
    </button>

    <!-- بخش بعدی (بخش ۲: منطق هسته و Web3) در پاسخ بعدی ارسال می‌شود -->
<script>
/**
 * -------------------------------------------------------------------------
 * CORE STATE & WEB3 ENGINE
 * -------------------------------------------------------------------------
 */

// ۱. تعریف وضعیت اولیه سیستم (State Management)
// تمام داده‌ها در اینجا مدیریت می‌شوند و در LocalStorage ذخیره می‌گردند
const STATE = {
    user: {
        isConnected: false,
        wallet: null,
        name: "مهمان",
        bio: "هنوز پروفایلی تعریف نکرده‌اید.",
        interests: ["فیزیک کوانتوم", "نجوم", "زیست‌شناسی"], // علایق پیش‌فرض
        avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=default",
        ownedVideos: [], // لیست ID ویدئوهایی که کاربر خریده
        highlights: []   // هایلایت‌های پروفایل (مشابه اینستاگرام)
    },
    videos: [
        // نمونه اولیه ویدئوها برای نمایش در اولین اجرا
        {
            id: "v1",
            title: "رازهای سیاهچاله در کهکشان آندرومدا",
            author: "دکتر آریا",
            authorId: "0x123...",
            url: "https://assets.mixkit.co/videos/preview/mixkit-stars-in-the-night-sky-1164-large.mp4",
            likes: 1240,
            isPaid: true,
            price: 0.005,
            category: "نجوم",
            tags: ["فضا", "نجوم", "علم"]
        },
        {
            id: "v2",
            title: "آزمایش‌های ساده مکانیک کوانتومی",
            author: "پروفسور سارا",
            authorId: "0x456...",
            url: "https://assets.mixkit.co/videos/preview/mixkit-abstract-motion-of-particles-in-space-23113-large.mp4",
            likes: 850,
            isPaid: false,
            price: 0,
            category: "فیزیک",
            tags: ["کوانتوم", "آزمایش"]
        }
    ],
    currentView: 'feed',
    isAiTyping: false
};

// ۲. مدیریت حافظه (Persistence)
function saveToLocalStorage() {
    localStorage.setItem('scientific_truth_state', JSON.stringify(STATE));
}

function loadFromLocalStorage() {
    const saved = localStorage.getItem('scientific_truth_state');
    if (saved) {
        const parsed = JSON.parse(saved);
        // ادغام داده‌های ذخیره شده با ساختار اصلی برای جلوگیری از خرابی در صورت آپدیت کد
        Object.assign(STATE.user, parsed.user);
        STATE.videos = parsed.videos || STATE.videos;
    }
}

// ۳. موتور سوئیچ بین صفحات (SPA Router)
function switchView(viewId) {
    const content = document.getElementById('app-content');
    STATE.currentView = viewId;
    
    // آپدیت استایل منوی پایین
    document.querySelectorAll('.nav-item').forEach(el => el.classList.replace('text-gold', 'text-gray-400'));
    const activeNav = document.getElementById(`nav-${viewId}`);
    if (activeNav) activeNav.classList.replace('text-gray-400', 'text-gold');

    // رندر کردن صفحه مربوطه
    renderView(viewId, content);
    
    // ذخیره آخرین وضعیت مشاهده شده
    saveToLocalStorage();
}

// ۴. اتصال مستقیم و هوشمند به کیف پول (Web3 Connection)
async function showWalletModal() {
    const container = document.getElementById('modal-container');
    container.classList.remove('pointer-events-none');
    container.innerHTML = `
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="glass w-full max-w-xs rounded-3xl p-6 text-center">
                <h3 class="text-lg font-bold mb-6 text-gold">اتصال به هویت دیجیتال</h3>
                <div class="space-y-4">
                    <button onclick="connectWallet('metamask')" class="w-full py-3 rounded-2xl bg-orange-500 text-white font-bold flex items-center justify-center gap-3 transition-transform active:scale-95">
                        <i class="fa-brands fa-ethereum text-xl"></i> MetaMask
                    </button>
                    <button onclick="connectWallet('trust')" class="w-full py-3 rounded-2xl bg-blue-600 text-white font-bold flex items-center justify-center gap-3 transition-transform active:scale-95">
                        <i class="fa-solid fa-shield-halved text-xl"></i> Trust Wallet
                    </button>
                    <button onclick="closeModal()" class="w-full py-2 text-gray-400 text-xs mt-4">لغو اتصال</button>
                </div>
            </div>
        </div>
    `;
}

async function connectWallet(providerType) {
    try {
        if (typeof window.ethereum !== 'undefined') {
            const provider = new ethers.providers.Web3Provider(window.ethereum);
            const accounts = await provider.send("eth_requestAccounts", []);
            
            // تنظیم پروفایل بر اساس ولت
            STATE.user.isConnected = true;
            STATE.user.wallet = accounts[0];
            // نام کاربر از ابتدای آدرس ولت ساخته می‌شود (به صورت خودکار)
            STATE.user.name = accounts[0].substring(0, 6) + '...' + accounts[0].substring(38);
            
            updateWalletUI();
            closeModal();
            saveToLocalStorage();
            
            // نمایش پیام موفقیت
            showToast("به پلتفرم خوش آمدید! هویت شما تایید شد.");
        } else {
            showToast("لطفاً افزونه MetaMask را نصب کنید.");
        }
    } catch (err) {
        console.error(err);
        showToast("خطا در اتصال به شبکه.");
    }
}

function updateWalletUI() {
    const btn = document.getElementById('wallet-btn');
    if (STATE.user.isConnected) {
        btn.innerHTML = `<i class="fa-solid fa-check text-green-500"></i> <span class="text-[10px]">${STATE.user.name}</span>`;
        btn.classList.add('border-green-500/50');
    }
}

// ۵. موتور جستجوی گوگل (Google News Integration)
function initNewsTicker() {
    const tickerContent = document.getElementById('ticker-content');
    // در دنیای واقعی این از API گرفته می‌شود، اینجا شبیه‌سازی می‌کنیم
    const newsData = [
        {t: "کشف اتم در قلب ستاره‌ها", q: "discovery of atoms in stars"},
        {t: "جدیدترین یافته‌های ناسا در مریخ", q: "NASA Mars latest findings"},
        {t: "بررسی تئوری نسبیت در کوانتوم", q: "Relativity in quantum mechanics"},
        {t: "آینده انرژی‌های هسته‌ای", q: "future of nuclear energy"}
    ];

    tickerContent.innerHTML = newsData.map(item => `
        <span class="news-item" onclick="searchGoogle('${item.q}')">
            <i class="fa-solid fa-bolt text-[10px] ml-1"></i> ${item.t}
        </span>
    `).join('');
}

function searchGoogle(query) {
    // باز کردن جستجوی گوگل در تب جدید
    window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
}

// ۶. سیستم اعلان (Toast Notification)
function showToast(msg) {
    const toast = document.createElement('div');
    toast.className = 'fixed top-20 left-1/2 -translate-x-1/2 glass px-6 py-3 rounded-full text-xs text-gold z-[3000] animate-bounce';
    toast.innerText = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

// اجرای اولیه موتورها
loadFromLocalStorage();
initNewsTicker();
</script>
<script>
/**
 * -------------------------------------------------------------------------
 * FEED & SOCIAL INTERACTION ENGINE
 * -------------------------------------------------------------------------
 */

// ۱. تابع اصلی رندر کردن صفحات (تکمیل شده برای بخش‌های مختلف)
function renderView(viewId, container) {
    container.innerHTML = '<div class="flex items-center justify-center h-full"><div class="loader"></div></div>';
    
    setTimeout(() => {
        switch(viewId) {
            case 'feed':
                renderFeed(container);
                break;
            case 'explore':
                renderExplore(container);
                break;
            case 'ai':
                renderAI(container);
                break;
            case 'profile':
                renderProfile(container);
                break;
        }
    }, 300); // ایجاد یک تاخیر کوچک برای حس واقعی بودن لودینگ
}

// ۲. رندر کردن فید اصلی (مشابه Reels)
function renderFeed(container) {
    let feedHTML = `
        <div class="flex flex-col items-center gap-6 pb-20">
            <!-- بخش هایلایت‌های کاربران (مشابه اینستاگرام) -->
            <div class="w-full flex overflow-x-auto gap-4 p-4 no-scrollbar bg-black/20">
                ${renderUserHighlights()}
            </div>

            <!-- لیست ویدئوها -->
            <div class="w-full max-w-md space-y-8">
    `;

    STATE.videos.forEach(video => {
        feedHTML += `
            <div class="relative aspect-[9/16] w-full rounded-3xl overflow-hidden shadow-2xl border border-white/10 bg-black">
                <!-- ویدئو -->
                <video class="w-full h-full object-cover" loop onclick="togglePlay(this)">
                    <source src="${video.url}" type="video/mp4">
                </video>

                <!-- لایه اطلاعات ویدئو (Overlay) -->
                <div class="absolute bottom-0 w-full p-5 bg-gradient-to-t from-black/80 to-transparent">
                    <h3 class="font-bold text-lg text-white">${video.title}</h3>
                    <p class="text-sm text-gray-300 mb-3">توسط: <span class="text-gold">${video.author}</span></p>
                    
                    <div class="flex justify-between items-center">
                        <div class="flex gap-4 text-white">
                            <button onclick="handleLike('${video.id}')" class="flex items-center gap-1">
                                <i class="fa-solid fa-heart ${video.liked ? 'text-red-500' : ''}"></i>
                                <span>${video.likes}</span>
                            </button>
                            <button onclick="openComments('${video.id}')" class="flex items-center gap-1">
                                <i class="fa-solid fa-comment"></i>
                                <span>${video.comments?.length || 0}</span>
                            </button>
                        </div>
                        ${video.isPaid ? `
                            <button onclick="buyVideo('${video.id}')" class="bg-gold text-black px-4 py-1 rounded-full text-xs font-bold">
                                خرید: ${video.price} ETH
                            </button>
                        ` : ''}
                    </div>
                </div>
            </div>
        `;
    });

    feedHTML += `</div></div>`;
    container.innerHTML = feedHTML;
}

// ۳. سیستم هایلایت (Highlights)
function renderUserHighlights() {
    // در نسخه واقعی، این‌ها از لیست کاربران آنلاین گرفته می‌شود
    const dummyUsers = [
        {name: 'خودم', img: STATE.user.avatar},
        {name: 'دکتر آریا', img: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Aris'},
        {name: 'سارا', img: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Sara'},
        {name: 'علی', img: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Ali'},
        {name: 'نور', img: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Noor'}
    ];

    return dummyUsers.map(u => `
        <div class="flex flex-col items-center min-w-[75px]">
            <div class="highlight-circle">
                <div class="highlight-inner">
                    <img src="${u.img}" class="w-full h-full object-cover" />
                </div>
            </div>
            <span class="text-[10px] mt-2 text-gray-400">${u.name}</span>
        </div>
    `).join('');
}

// ۴. عملیات ویدئو
function togglePlay(video) {
    if (video.paused) video.play();
    else video.pause();
}

function handleLike(videoId) {
    const video = STATE.videos.find(v => v.id === videoId);
    if (video) {
        video.likes++;
        video.liked = !video.liked;
        showToast("لایک شد!");
        saveToLocalStorage();
        // آپدیت سریع UI بدون رندر مجدد کل صفحه
        renderView('feed', document.getElementById('app-content'));
    }
}

// ۵. سیستم آپلود (شبیه‌سازی شده برای GitHub Pages)
function showUploadModal() {
    const container = document.getElementById('modal-container');
    container.classList.remove('pointer-events-none');
    container.innerHTML = `
        <div class="absolute inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
            <div class="glass w-full max-w-md rounded-3xl p-6">
                <h3 class="text-xl font-bold mb-6 text-gold text-center">انتشار اثر علمی جدید</h3>
                <div class="space-y-4">
                    <div>
                        <label class="text-xs text-gray-400 mb-2 block">عنوان ویدئو</label>
                        <input id="up-title" type="text" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm focus:border-gold outline-none">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 mb-2 block">انتخاب فایل (MP4)</label>
                        <input id="up-file" type="file" accept="video/*" class="w-full text-xs text-gray-400">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs text-gray-400 mb-2 block">دسته‌بندی</label>
                            <select id="up-cat" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm">
                                <option value="فیزیک">فیزیک</option>
                                <option value="نجوم">نجوم</option>
                                <option value="زیست">زیست</option>
                                <option value="ریاضی">ریاضی</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs text-gray-400 mb-2 block">قیمت (ETH)</label>
                            <input id="up-price" type="number" step="0.001" value="0" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm">
                        </div>
                    </div>
                    <button onclick="processUpload()" class="w-full py-4 bg-gold text-black font-black rounded-2xl mt-4">انتشار در پایگاه حقیقت</button>
                    <button onclick="closeModal()" class="w-full text-gray-500 text-xs">انصراف</button>
                </div>
            </div>
        </div>
    `;
}

function processUpload() {
    const title = document.getElementById('up-title').value;
    const category = document.getElementById('up-cat').value;
    const price = parseFloat(document.getElementById('up-price').value);
    const fileInput = document.getElementById('up-file');

    if (!title || !fileInput.files[0]) {
        showToast("لطفاً تمام فیلدها را پر کنید.");
        return;
    }

    // شبیه‌سازی آپلود (در GitHub Pages فقط در LocalStorage ذخیره می‌شود)
    const newVideo = {
        id: "v" + Date.now(),
        title: title,
        author: STATE.user.name,
        authorId: STATE.user.wallet || "Unknown",
        url: URL.createObjectURL(fileInput.files[0]), // لینک موقت برای نمایش در مرورگر
        likes: 0,
        isPaid: price > 0,
        price: price,
        category: category,
        tags: [category]
    };

    STATE.videos.unshift(newVideo);
    saveToLocalStorage();
    closeModal();
    showToast("ویدئو با موفقیت منتشر شد!");
    switchView('feed');
}

// ۶. رندر بخش جستجو و اکسپلور (Search & Explore)
function renderExplore(container) {
    container.innerHTML = `
        <div class="p-4">
            <div class="relative mb-8">
                <input type="text" placeholder="جستجوی دانش یا کاربر..." class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 pr-12 pl-4 focus:border-gold outline-none">
                <i class="fa-solid fa-magnifying-glass absolute right-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
            </div>
            
            <h3 class="text-gold text-sm font-bold mb-4">موضوعات داغ</h3>
            <div class="flex flex-wrap gap-2 mb-8">
                ${["فیزیک کوانتوم", "سیاهچاله‌ها", "ژنتیک", "هوش مصنوعی", "تاریخ باستان", "انرژی سبز"].map(tag => `
                    <span class="glass px-4 py-2 rounded-full text-xs cursor-pointer hover:bg-gold hover:text-black transition-all">${tag}</span>
                `).join('')}
            </div>

            <h3 class="text-gold text-sm font-bold mb-4">پروفایل‌های برتر</h3>
            <div class="grid grid-cols-2 gap-4">
                <div class="glass p-4 rounded-2xl text-center">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Expert1" class="w-16 h-16 rounded-full mx-auto mb-2 border border-gold">
                    <p class="text-xs font-bold">دکتر سهراب</p>
                    <p class="text-[8px] text-gray-500">فیزیکدان</p>
                </div>
                <div class="glass p-4 rounded-2xl text-center">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Expert2" class="w-16 h-16 rounded-full mx-auto mb-2 border border-gold">
                    <p class="text-xs font-bold">دکتر مریم</p>
                    <p class="text-[8px] text-gray-500">زیست‌شناس</p>
                </div>
            </div>
        </div>
    `;
}

function closeModal() {
    const container = document.getElementById('modal-container');
    container.classList.add('pointer-events-none');
    container.innerHTML = '';
}
</script>
<script>
/**
 * -------------------------------------------------------------------------
 * PROFILE, GALLERY & INTERESTS ENGINE
 * -------------------------------------------------------------------------
 */

// ۱. رندر کردن صفحه پروفایل
function renderProfile(container) {
    const user = STATE.user;
    const userVideos = STATE.videos.filter(v => v.author === user.name);

    let profileHTML = `
        <div class="w-full max-w-md mx-auto">
            <!-- هدر پروفایل -->
            <div class="relative pt-10 pb-6 px-4 text-center">
                <div class="relative inline-block">
                    <div class="highlight-circle w-24 h-24">
                        <div class="highlight-inner">
                            <img src="${user.avatar}" class="w-full h-full object-cover rounded-full" />
                        </div>
                    </div>
                    <button onclick="editAvatar()" class="absolute bottom-0 right-0 glass w-8 h-8 rounded-full flex items-center justify-center text-[10px]">
                        <i class="fa-solid fa-camera"></i>
                    </button>
                </div>
                <h2 class="text-xl font-black mt-4">${user.name}</h2>
                <p class="text-xs text-gray-400 mt-1">${user.bio}</p>
                
                <div class="flex justify-center gap-6 mt-6">
                    <div class="text-center">
                        <p class="font-bold">${user.ownedVideos.length}</p>
                        <p class="text-[10px] text-gray-500">خریداری شده</p>
                    </div>
                    <div class="text-center">
                        <p class="font-bold">${userVideos.length}</p>
                        <p class="text-[10px] text-gray-500">منتشر شده</p>
                    </div>
                </div>
            </div>

            <!-- تب‌های پروفایل (گالری / ویدئوها / هایلایت‌ها) -->
            <div class="flex border-b border-white/10 mb-4">
                <button class="flex-1 py-3 text-xs font-bold border-b-2 border-gold">ویدئوهای من</button>
                <button class="flex-1 py-3 text-xs font-bold text-gray-500">هایلایت‌ها</button>
                <button class="flex-1 py-3 text-xs font-bold text-gray-500">گالری تصاویر</button>
            </div>

            <!-- گالری ویدئوهای کاربر (Grid Style) -->
            <div class="grid grid-cols-3 gap-1 px-1">
                ${userVideos.length > 0 ? userVideos.map(v => `
                    <div class="aspect-square bg-gray-800 overflow-hidden relative group" onclick="watchVideo('${v.id}')">
                        <img src="${v.url}" class="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition-opacity">
                        <div class="absolute bottom-1 right-1 flex items-center gap-1 text-[8px]">
                            <i class="fa-solid fa-play"></i> ${v.title.substring(0,10)}...
                        </div>
                    </div>
                `).join('') : `
                    <div class="col-span-3 py-20 text-center text-gray-500 text-xs">
                        هنوز هیچ ویدئویی منتشر نکرده‌اید.
                    </div>
                `}
            </div>
            
            <!-- دکمه ویرایش پروفایل -->
            <div class="mt-10 p-4 glass rounded-2xl">
                <h3 class="text-xs font-bold text-gold mb-4">تنظیمات حساب</h3>
                <button onclick="editBio()" class="w-full text-right text-xs py-2 border-b border-white/5">ویرایش بیوگرافی</button>
                <button onclick="manageInterests()" class="w-full text-right text-xs py-2 border-b border-white/5">مدیریت علایق علمی</button>
                <button onclick="logout()" class="w-full text-right text-xs py-2 text-red-500">خروج از حساب</button>
            </div>
        </div>
    `;
    container.innerHTML = profileHTML;
}

// ۲. مدیریت علایق (Interests Engine) - گسترش یافته
function manageInterests() {
    const container = document.getElementById('modal-container');
    container.classList.remove('pointer-events-none');
    
    const allPossibleInterests = [
        "فیزیک کوانتوم", "نجوم و کهکشان", "زیست‌شناسی سلولی", "هوش مصنوعی", 
        "تاریخ باستان", "انرژی‌های سبز", "مکانیک کلاسیک", "ریاضیات محض", 
        "روانشناسی شناختی", "فلسفه علم", "هندسه فرکتال", "شیمی آلی"
    ];

    container.innerHTML = `
        <div class="absolute inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
            <div class="glass w-full max-w-md rounded-3xl p-6">
                <h3 class="text-lg font-bold mb-2 text-gold text-center">علایق علمی خود را انتخاب کنید</h3>
                <p class="text-[10px] text-center text-gray-400 mb-6">این موضوعات در فید اصلی شما اولویت خواهند داشت</p>
                
                <div class="grid grid-cols-2 gap-3 max-h-[300px] overflow-y-auto p-2">
                    ${allPossibleInterests.map(interest => `
                        <div onclick="toggleInterest('${interest}')" 
                             id="int-${interest}"
                             class="interest-tag glass py-2 px-3 rounded-xl text-[10px] text-center cursor-pointer transition-all 
                             ${STATE.user.interests.includes(interest) ? 'border-gold text-gold bg-gold/10' : 'text-gray-400'}">
                            ${interest}
                        </div>
                    `).join('')}
                </div>

                <button onclick="saveInterests()" class="w-full py-4 bg-gold text-black font-black rounded-2xl mt-6">ذخیره و اعمال تغییرات</button>
                <button onclick="closeModal()" class="w-full text-gray-500 text-xs mt-4">لغو</button>
            </div>
        </div>
    `;
}

function toggleInterest(interest) {
    const idx = STATE.user.interests.indexOf(interest);
    if (idx > -1) {
        STATE.user.interests.splice(idx, 1);
    } else {
        STATE.user.interests.push(interest);
    }
    // آپدیت بصری آنی
    const el = document.getElementById(`int-${interest}`);
    if (STATE.user.interests.includes(interest)) {
        el.classList.add('border-gold', 'text-gold', 'bg-gold/10');
        el.classList.remove('text-gray-400');
    } else {
        el.classList.remove('border-gold', 'text-gold', 'bg-gold/10');
        el.classList.add('text-gray-400');
    }
}

function saveInterests() {
    saveToLocalStorage();
    closeModal();
    showToast("علایق شما به‌روز شد!");
    switchView('feed'); // بازگشت به فید برای مشاهده تغییرات
}

// ۳. ویرایش بیوگرافی
function editBio() {
    const newBio = prompt("بیوگرافی جدید خود را وارد کنید:", STATE.user.bio);
    if (newBio !== null) {
        STATE.user.bio = newBio;
        saveToLocalStorage();
        renderView('profile', document.getElementById('app-content'));
    }
}

// ۴. مدیریت خروج
function logout() {
    if(confirm("آیا مطمئن هستید که می‌خواهید خارج شوید؟")) {
        localStorage.clear();
        location.reload();
    }
}

// ۵. تابع کمکی برای نمایش عکس پروفایل (شبیه‌سازی)
function editAvatar() {
    const newSeed = Math.random().toString(36).substring(7);
    STATE.user.avatar = `https://api.dicebear.com/7.x/avataaars/svg?seed=${newSeed}`;
    saveToLocalStorage();
    renderView('profile', document.getElementById('app-content'));
}
</script>
<script>
/**
 * -------------------------------------------------------------------------
 * AI ASSISTANT ENGINE & APP INITIALIZATION
 * -------------------------------------------------------------------------
 */

// ۱. رندر کردن بخش هوش مصنوعی (Scientific AI Assistant)
function renderAI(container) {
    container.innerHTML = `
        <div class="flex flex-col h-[calc(100vh-140px)] max-w-md mx-auto p-4">
            <!-- هدر هوش مصنوعی -->
            <div class="glass p-4 rounded-2xl mb-4 flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gold/20 flex items-center justify-center text-gold">
                    <i class="fa-solid fa-brain"></i>
                </div>
                <div>
                    <h3 class="text-sm font-bold text-gold">دستیار حقیقت‌یاب علمی</h3>
                    <p class="text-[10px] text-gray-400">آماده پاسخگویی به پیچیده‌ترین سؤالات علمی شما</p>
                </div>
            </div>

            <!-- باکس چت -->
            <div id="ai-chat-box" class="flex-1 overflow-y-auto space-y-4 pr-2 mb-4">
                ${STATE.aiChats.length > 0 ? STATE.aiChats.map(chat => `
                    <div class="flex flex-col ${chat.sender === 'user' ? 'items-end' : 'items-start'}">
                        <div class="max-w-[85%] p-3 rounded-2xl text-xs ${chat.sender === 'user' ? 'bg-gold text-black rounded-bl-none' : 'glass text-white rounded-br-none'}">
                            ${chat.message}
                        </div>
                        <span class="text-[8px] text-gray-500 mt-1">${chat.time}</span>
                    </div>
                `).join('') : `
                    <div class="text-center py-20 text-gray-500 text-xs">
                        سؤال خود را درباره فیزیک، نجوم، زیست‌شناسی یا هر حوزه علمی دیگری بپرسید...
                    </div>
                `}
            </div>

            <!-- اینپوت ارسال پیام -->
            <div class="flex gap-2">
                <input id="ai-input" type="text" placeholder="پرسش علمی خود را بنویسید..." 
                       class="flex-1 bg-white/5 border border-white/10 rounded-2xl px-4 py-3 text-xs focus:border-gold outline-none"
                       onkeypress="if(event.key === 'Enter') sendAIMessage()">
                <button onclick="sendAIMessage()" class="w-12 h-12 bg-gold text-black rounded-2xl flex items-center justify-center font-bold">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    `;
    
    // اسکرول به پایین چت
    const chatBox = document.getElementById('ai-chat-box');
    chatBox.scrollTop = chatBox.scrollHeight;
}

// ۲. پردازش پیام هوش مصنوعی
function sendAIMessage() {
    const input = document.getElementById('ai-input');
    const message = input.value.trim();
    if (!message) return;

    const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    // افزودن پیام کاربر
    STATE.aiChats.push({ sender: 'user', message: message, time: timeNow });
    input.value = '';
    renderAI(document.getElementById('app-content'));

    // شبیه‌سازی پاسخ هوشمند و علمی
    setTimeout(() => {
        let aiReply = "بر اساس داده‌های پایگاه حقیقت علمی، این پدیده از قوانین فیزیک و مکانیک کوانتوم پیروی می‌کند. برای بررسی دقیق‌تر، مقالات مرتبط در فید را مطالعه کنید.";
        
        if (message.includes("کوانتوم") || message.includes("فیزیک")) {
            aiReply = "فیزیک کوانتوم شاخه‌ای از علم است که به مطالعه رفتار ماده و انرژی در مقیاس‌های اتمی و زیراتمی می‌پردازد. در این مقیاس، قوانین فیزیک کلاسیک پاسخگو نیستند.";
        } else if (message.includes("نجوم") || message.includes("فضا")) {
            aiReply = "کیهان‌شناسی مدرن با استفاده از تلسکوپ‌های پیشرفته مانند جیمز وب توانسته است رازهای تازه‌ای از آغاز جهان و سیاهچاله‌ها آشکار کند.";
        }

        STATE.aiChats.push({ sender: 'ai', message: aiReply, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
        saveToLocalStorage();
        renderAI(document.getElementById('app-content'));
    }, 1000);
}

// ۳. راه‌اندازی اولیه برنامه (Initialization)
window.addEventListener('DOMContentLoaded', () => {
    // بررسی وضعیت ذخیره شده یا بارگذاری پیش‌فرض
    const savedState = localStorage.getItem('scientific_truth_state');
    if (savedState) {
        try {
            const parsed = JSON.parse(savedState);
            STATE.user = parsed.user || STATE.user;
            if (parsed.videos && parsed.videos.length > 0) {
                STATE.videos = parsed.videos;
            }
            if (parsed.aiChats) {
                STATE.aiChats = parsed.aiChats;
            }
        } catch(e) {
            console.error("Error loading state:", e);
        }
    }

    // رندر اولیه صفحه فید
    switchView('feed');
    
    // آپدیت نام کاربر در هدر اگر ولت متصل باشد
    if(STATE.user.wallet) {
        document.getElementById('user-wallet-display').innerText = STATE.user.wallet.substring(0,6) + '...';
    }
});

// ۴. توابع کمکی عمومی (Toast Notification)
function showToast(text) {
    const toast = document.createElement('div');
    toast.className = 'fixed top-20 left-1/2 -translate-x-1/2 glass bg-black/80 text-gold px-6 py-3 rounded-full text-xs z-50 shadow-2xl border border-gold/30 animate-bounce';
    toast.innerText = text;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
}
</script>
